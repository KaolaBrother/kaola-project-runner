id: "opencode"
runtime_name: "OpenCode"
skill_name: "opencode-kaola-project-runner"
display_name: "OpenCode Kaola Project Runner"
short_description: "Communicate with OpenCode through exact ACP"
default_prompt: "Use $opencode-kaola-project-runner to start an exact OpenCode ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an OpenCode main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "opencode-kaola"
binary_name: "opencode"
binary_env: "OPENCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the OpenCode executable and report optional Kaola carrier/configuration evidence without gating communication, plus loopback=direct|excluded|ensured: what the opencode child sees once a forward proxy is set (ensured means the Runner appends the missing loopback entries)."
launch_summary: "ACP runs opencode acp. Ordinary fresh managed launches select a process-only native V2 build allow policy through OPENCODE_CONFIG when no config source or explicit mode is supplied; existing native config, explicit mode, resume/continue and custom command retain precedence. start reports native_permission_policy. ACP has no skip-all config option; permit settles each request that still arises."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "DeepSeek V4.1 Flash"
default_model_id: "opencode-go/deepseek-v4.1-flash"
default_model_parameters: "no Runner effort override"
default_model_effort: ""
default_model_profile: "Fast implementation worker for tasks with clear goals and boundaries; tends to investigate deeper root causes and reduce unrelated changes."
default_model_class: "Worker"
named_tiers: ""
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as zhipuai-coding-plan/glm-5.3-flash are explicit model choices, not a Fast switch"
acp_command: "python3 $SKILL_DIR/scripts/kaola-opencode-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "no ACP skip-all config option: model/effort/mode are ACP selections, not launch-level permission policy; requests offer allow_once/allow_always/reject_once. OpenCode V2 2.0.22/protocol 1 consumed the native OPENCODE_CONFIG file slot in actual ACP QA. Runner selects agents.build.permissions allow only when no existing config source or explicit mode/resume/custom command exists; this avoids overriding global or project policy, and never merges supplied OPENCODE_CONFIG or OPENCODE_CONFIG_CONTENT. plan and session permissions remain native; permit settles each request that still arises. V1 permission/bash/task schema is distinct from V2 permissions/shell/subagent; V2.0.11-to-2.0.22 source comparison does not establish a version-drift cause. V2 reaches its own server over loopback HTTP, and a forward proxy on that hop leaves initialize working while every session method answers ClientError; so when HTTP(S)_PROXY is set, the Runner appends any missing 127.0.0.1/localhost to NO_PROXY/no_proxy in the opencode child env only, keeping operator entries and never touching the Runner env. OpenCode 2.0.22 publishes later providers after session/new: the first model list can be only opencode/ while a following config_option_update adds opencode-go/deepseek-v4.1-flash. Setting that id before the update returns JSON-RPC -32602 model not found; start waits, bounded, until the live option list advertises the requested id and then sets it, with no model substitution"
acp_verified_versions: "cli=2.0.22;protocol=1"
acp_env_allowlist: "OPENCODE_API_KEY,NO_PROXY"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "Native V2 build full-access default only for fresh managed launches without existing config sources; existing global/project/native config is left intact (including non-permission config). Explicit --permission-mode selects the native build/plan agent via mode and suppresses the default. No auto-permit; remaining requests require an Agent decision."
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "Historical evidence: 1.18.17 candidate methods returned -32601; 2.0.11 initialize alone did not measure steer. CLI 2.0.22 uses the local V2 integration. The local V2 adapter exposes _session/steering over the existing ACP contract. It guards the original active ACP request id and calls the installed plugin session.prompt API with delivery steer and resume false. Native ACP retains its stream and original prompt. written with native-admitted confirms inbox admission only. A turn-end race can leave input pending; it cannot resume an idle turn. No cancel fallback. Old holders and custom opencode acp commands have no adapter entry; a controlled restart is needed to use this path."
host_skill_entry: "/kaola-project-runner"
