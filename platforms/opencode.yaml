id: "opencode"
runtime_name: "OpenCode"
skill_name: "opencode-kaola-project-runner"
display_name: "OpenCode Kaola Project Runner"
short_description: "Communicate with OpenCode through exact ACP"
default_prompt: "Use $opencode-kaola-project-runner to start an exact OpenCode ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an OpenCode main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "opencode-kaola"
binary_name: "opencode"
binary_env: "OPENCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the OpenCode executable and report optional Kaola carrier/configuration evidence without gating communication, plus loopback=direct|excluded|ensured: what the opencode child sees once a forward proxy is set (ensured means the Runner appends the missing loopback entries)."
launch_summary: "ACP runs opencode acp. ACP has no skip-all, so ACP start sets no mode and permit settles each request; configOptions.mode is agent identity (build/plan), not skip-all."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "CLI native opening model"
default_model_id: ""
default_model_parameters: "no Runner model or effort override"
default_model_effort: ""
upgrade_model_name: "CLI native opening model"
upgrade_model_id: ""
upgrade_model_parameters: "no Runner model or effort override"
upgrade_model_effort: ""
alt_tier_label: ""
alt_model_name: ""
alt_model_id: ""
alt_model_parameters: ""
alt_model_effort: ""
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as zhipuai-coding-plan/glm-5.3-flash are explicit model choices, not a Fast switch"
acp_command: "opencode acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "no ACP skip-all measured on 2.0.11 - session/request_permission offers only allow_once/allow_always/reject_once and configOptions carries model/effort/mode only; there is no skip-all, and permit settles each request. V2 reaches its own server over loopback HTTP, and a forward proxy on that hop leaves initialize working while every session method answers ClientError; so when HTTP(S)_PROXY is set, the Runner appends any missing 127.0.0.1/localhost to NO_PROXY/no_proxy in the opencode child env only, keeping operator entries and never touching the Runner env"
acp_verified_versions: "cli=2.0.15;protocol=1"
acp_env_allowlist: "OPENCODE_API_KEY,NO_PROXY"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "no full-access default: ACP has no skip-all, so `start` sets no mode and `permit` settles each request; `--permission-mode` has no ACP option to set and reports `config-option-unavailable`"
acp_init_meta: ""
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unknown"
acp_steer_method: ""
steering_summary: "Historical evidence, OpenCode 1.18.17: all four candidate steering methods answered JSON-RPC -32601 and `initialize` advertised no steering `_meta`. That is not a measurement of the verified 2.0.x builds: 2.0.11 `initialize` also advertised no steering `_meta`, but no steering method was re-probed on 2.0.11 or on the recorded 2.0.15, so native steering is unknown until a live probe settles it. The composite `--steer-mode interrupt` was exercised live on 1.18.31."
