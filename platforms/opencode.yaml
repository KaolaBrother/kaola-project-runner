steering_summary: "Historical evidence, OpenCode 1.18.17: no steering entry on the ACP surface - all four candidate methods answered JSON-RPC -32601 and `initialize` advertised no steering `_meta`. That probe is a 1.18.17 result, not a measurement of the `acp_verified_versions` 1.18.29 build; the current version has not been re-probed, so treat its native-steering capability as unknown until a live probe settles it, and do not read the 1.18.17 outcome as a current-version claim. The composite `--steer-mode interrupt` is unaffected and was exercised live on 1.18.31."
