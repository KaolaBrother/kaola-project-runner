id: "opencode"
runtime_name: "OpenCode"
skill_name: "opencode-kaola-project-runner"
display_name: "OpenCode Kaola Project Runner"
short_description: "Run Kaola Workflow projects through OpenCode"
default_prompt: "Use $opencode-kaola-project-runner to start workflow-next immediately in the current Git repository."
description: "Use when Codex should run Kaola Workflow through an OpenCode main conversation in an exact tmux session. A bare invocation uses the current Git repository and starts workflow-next so it can select the most appropriate Issue batch."
session_prefix: "opencode-kaola"
binary_name: "opencode"
binary_env: "OPENCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Require the Kaola commands, agents, plugins, support scripts, and a usable project or global OpenCode configuration without rewriting user-owned opencode.json."
launch_summary: "Launch opencode <repo> --mini."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
