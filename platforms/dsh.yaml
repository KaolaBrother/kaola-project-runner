id: "dsh"
runtime_name: "dsh"
skill_name: "dsh-kaola-project-runner"
display_name: "dsh Kaola Project Runner"
short_description: "Communicate with dsh through exact ACP"
default_prompt: "Use $dsh-kaola-project-runner to start an exact dsh ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a dsh (DeepSeek Harness) main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "dsh-kaola"
binary_name: "dsh"
binary_env: "DSH_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/resume <session-id> over ACP"
preflight_summary: "Verify the dsh executable, report `dsh --version` and whether an `acp` profile exists under $DSH_HOME, and never write anything under that home."
launch_summary: "The local ACP adapter runs the exact DSH_BIN with --profile acp and one process-local --patch steer plugin; the shipped automation-only ACP v1 stdio server; the acp profile takes no application arguments and dsh advertises no ACP mode option, so ACP start sets no mode and launches with DSH_PERMISSION_MODE instead (see SKILL.md). The default preset opencode-go/deepseek-v4.1-flash travels as the acp_model_map wire value [\"opencode-go\",\"deepseek-v4.1-flash\"]; \"DeepSeek V4.1 Flash\" is a Runner-side display name, not a catalog string or the OpenCode Go package display name (the catalog shows bare deepseek-v4.1-flash, and deepseek-official/deepseek-flash is a different route). The shipped profile pins deepseek-official, so this default needs its own credentialed provider. dsh 0.1.7-rc.2 is verified only on this condition: stock, the default cannot run, because the stock opencode-go catalog lists no deepseek-v4.1-flash (set_config_option answers -32602 and the receipt reports the seat still on deepseek-official/deepseek-v4-flash) and stock requests carry no x-opencode-session header (OpenCode Go answers 400 MissingSessionID). Operator recovery, never done by the Runner: in $DSH_HOME/profiles/acp/cordis.patch.yml add one `- id: llm-pi-ai` entry whose `config.providers.opencode-go` sets `apiKeyEnv: OPENCODE_GO_API_KEY`, `api: openai-completions`, `baseURL` copied from an openai-completions entry of pi-ai's providers/data/opencode-go.json, `headers: {x-opencode-session: <operator value>}`, and `models: [{id: deepseek-v4.1-flash, contextWindow: 1000000, maxTokens: 384000, input: [text, image], compat: {thinkingFormat: deepseek, requiresReasoningContentOnAssistantMessages: true, maxTokensField: max_tokens, supportsStore: false, supportsDeveloperRole: false}}]`. That models list replaces the route's whole stock catalog and the static header is shared by every session. Prove it in a throwaway DSH_HOME first: `start`, then check the start receipt's `config_application.model` is applied and `observe`/`status` shows the model `currentValue` [\"opencode-go\",\"deepseek-v4.1-flash\"], then ONE `send`; preflight's catalog probe is `--version` only and is not this check. dsh 0.1.7 renames $DSH_HOME/settings.yaml to settings.yaml.imported on the first boot of any profile and imports it into that profile only, so keep the route in the acp profile patch."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "DeepSeek V4.1 Flash"
default_model_id: "opencode-go/deepseek-v4.1-flash"
default_model_parameters: "no Runner effort override"
default_model_effort: ""
default_model_profile: "Fast implementation worker for tasks with clear goals and boundaries; emphasizes autonomous progress, iterative validation, and self-repair."
default_model_class: "Worker"
named_tiers: ""
fast_support: "none"
fast_summary: "no native Fast toggle and no Fast config option on the ACP surface; the catalog's flash-named routes are explicit model choices, not a Fast switch"
acp_command: "python3 $SKILL_DIR/scripts/kaola-dsh-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "native server behind the local steer adapter (acp_wrapper_pin empty); agentInfo is deepseek-harness-acp/0.0.1 under launcher dsh 0.1.7-rc.2, as under 0.1.5-rc.2, so it does not name the harness build: the harness is @deepseek-ai/dsh-acp-app and @deepseek-ai/dsh-acp, which the launcher package pins to its own exact version and which resolve from the launcher's install, so there is no standalone harness upgrade (version check: see the [DSH loaded ACP harness section](https://github.com/KaolaBrother/kaola-project-runner/blob/main/docs/api.md#dsh-loaded-acp-harness)); sessionCapabilities is {close,list,resume}, so the Runner takes the session/resume branch, whose result carries configOptions but no sessionId; session/load, session/set_mode, session/delete, session/fork and terminal/* answer -32601, so there is no mode config option; config options arrive in the session/new result: model (JSON-encoded [provider,model] strings, mapped from plain ids by acp_model_map) and reasoning_effort (off/low/high/max, route-dependent); session/list entries carry only sessionId and cwd (no updatedAt), so --continue is unsupported; the shipped acp profile pins provider deepseek-official regardless of the user's agent-default-model, so a ready session may still fail its first prompt with no API key for provider route \"deepseek-official\" unless DEEPSEEK_API_KEY is set or --model selects a credentialed route; the ACP composition sends no session/request_permission at all; the permission mode is the launch variable DSH_PERMISSION_MODE (Runner default danger-full-access, see SKILL.md), and dsh's own default workspace-write denies shell writes outside the workspace, /tmp and $TMPDIR and is inherited by any Runner start from that shell; dsh 0.1.7 creates the shipped acp profile under $DSH_HOME on its own first boot (the Runner never writes there), and the stock 0.1.7-rc.2 opencode-go route cannot serve the default preset: see [platform.md](platform.md) Launch"
acp_verified_versions: "cli=0.1.7-rc.2;agent=deepseek-harness-acp/0.0.1;protocol=1;condition=operator-declared-opencode-go-route"
acp_env_allowlist: "DSH_HOME,DEEPSEEK_API_KEY"
acp_login_requires_pty: "false"
login_summary: "There is no login step (authMethods is empty); a provider route still needs its credential, such as DEEPSEEK_API_KEY."
permission_summary: "`start` launches with `DSH_PERMISSION_MODE=danger-full-access` (no Seatbelt sandbox, approval never) unless the caller set that variable; `--permission-mode read-only|workspace-write|danger-full-access` wins over both (bypassPermissions maps to danger-full-access)"
acp_init_meta: ""
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: "deepseek-official/deepseek-flash=[\"deepseek-official\",\"deepseek-flash\"];deepseek-official/deepseek-v4-flash=[\"deepseek-official\",\"deepseek-v4-flash\"];deepseek-official/deepseek-v4-pro=[\"deepseek-official\",\"deepseek-v4-pro\"];deepseek-official/deepseek-v4-flash-vision-exp=[\"deepseek-official\",\"deepseek-v4-flash-vision-exp\"];opencode-go/deepseek-v4.1-flash=[\"opencode-go\",\"deepseek-v4.1-flash\"];opencode-go/deepseek-v4-flash=[\"opencode-go\",\"deepseek-v4-flash\"];opencode-go/deepseek-v4-pro=[\"opencode-go\",\"deepseek-v4-pro\"];opencode-go/deepseek-v4-flash-vision-exp=[\"opencode-go\",\"deepseek-v4-flash-vision-exp\"]"
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "DSH 0.2.0-rc.2 supports native agent.steer next-step inbox admission. KPR loads a local plugin through the documented per-process --patch overlay, preserves the native ACP stream and prompt owner, and exposes the existing _session/steering contract. The adapter checks the exact ACP session and original request id. native-admitted confirms admission only; processing needs session output. Idle calls are refused locally. A native turn-end race can start a detached later turn; the receipt states that result, with no cancel, stop, restart or replay. The native ACP server still refuses concurrent session/prompt. Custom direct commands do not load this adapter."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"opencode-go\",\"name\":\"OpenCode Go\",\"windows\":[\"weekly\",\"monthly\"]}]"
model_package_rule: "{\"kind\":\"provider_prefix\",\"providers\":{\"opencode-go\":\"opencode-go\"},\"gaps\":[\"deepseek-official\"]}"
