id: "dsh"
runtime_name: "dsh"
skill_name: "dsh-kaola-project-runner"
display_name: "dsh Kaola Project Runner"
short_description: "Communicate with dsh through exact tmux"
default_prompt: "Use $dsh-kaola-project-runner to start an exact dsh tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a dsh (DeepSeek Harness) main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "dsh-kaola"
binary_name: "dsh"
binary_env: "DSH_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/resume <session-id> over ACP"
preflight_summary: "Verify the dsh executable, report `dsh --version` and whether an `acp` profile exists under $DSH_HOME, and never write anything under that home."
launch_summary: "Launch `dsh --profile acp`, the shipped automation-only ACP v1 stdio server; there is no PTY transport for this platform and the acp profile accepts no application arguments. The profile bundle pins provider deepseek-official and ignores the user's agent-default-model, so a session can start ready and still fail its first prompt with `no API key for provider route \"deepseek-official\"`: supply DEEPSEEK_API_KEY in the environment or pass --model to select a credentialed route. dsh's ACP composition never sends session/request_permission, so tool calls — including writes outside the session workspace — run unattended with no client approval gate."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "CLI native opening model"
default_model_id: ""
default_model_parameters: "no Runner model or effort override"
default_model_effort: ""
upgrade_model_name: "CLI native opening model"
upgrade_model_id: ""
upgrade_model_parameters: "no Runner model or effort override"
upgrade_model_effort: ""
fast_support: "none"
fast_summary: "no native Fast toggle and no Fast config option on the ACP surface; the catalog's flash-named routes are explicit model choices, not a Fast switch"
default_transport: "acp"
acp_command: "dsh --profile acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "automation-only ACP v1 stdio server, native (no bridge, acp_wrapper_pin empty); agentInfo is deepseek-harness-acp/0.0.1 while the launcher is dsh 0.1.5-rc.2; agentCapabilities.sessionCapabilities is {close,list,resume} so the Runner takes the session/resume branch, and the resume result carries configOptions but no sessionId; session/load, session/set_mode, session/delete, session/fork and terminal/* all answer -32601, so there is no mode config option and nothing for a skip-all to select; authMethods is empty and authenticate returns immediately, so there is no login step; config options are declared in the session/new result — model (values are JSON-encoded [provider,model] arrays as strings, mapped from plain ids by acp_model_map) and reasoning_effort (off/low/high/max, route-dependent); session/list entries carry only sessionId and cwd with no updatedAt, so --continue cannot determine a latest session and is unsupported; the shipped acp profile pins provider deepseek-official regardless of the user's agent-default-model, so a ready session may still fail its first prompt without DEEPSEEK_API_KEY; the ACP composition sends no session/request_permission at all, so tool calls run unattended by default — there is no approval gate to skip; creating an acp profile with --from-default-profile writes under $DSH_HOME and is an operator precondition the Runner never performs"
acp_verified_versions: "cli=0.1.5-rc.2;agent=deepseek-harness-acp/0.0.1;protocol=1"
acp_env_allowlist: "DSH_HOME,DEEPSEEK_API_KEY"
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: "deepseek-official/deepseek-flash=[\"deepseek-official\",\"deepseek-flash\"];deepseek-official/deepseek-v4-flash=[\"deepseek-official\",\"deepseek-v4-flash\"];deepseek-official/deepseek-v4-pro=[\"deepseek-official\",\"deepseek-v4-pro\"];deepseek-official/deepseek-v4-flash-vision-exp=[\"deepseek-official\",\"deepseek-v4-flash-vision-exp\"];opencode-go/deepseek-v4.1-flash=[\"opencode-go\",\"deepseek-v4.1-flash\"];opencode-go/deepseek-v4-flash=[\"opencode-go\",\"deepseek-v4-flash\"];opencode-go/deepseek-v4-pro=[\"opencode-go\",\"deepseek-v4-pro\"];opencode-go/deepseek-v4-flash-vision-exp=[\"opencode-go\",\"deepseek-v4-flash-vision-exp\"]"
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "No steering entry on the ACP surface: `_session/steering`, `session/steering`, `session/steer` and `_session/steer` all answer JSON-RPC -32601 on dsh 0.1.5-rc.2 (agent deepseek-harness-acp/0.0.1) and `initialize` advertises no steering `_meta`. The composite `--steer-mode interrupt` is the usable path and needs no raised timeout: `session/cancel` is accepted as a notification and the running turn settles in about 0.01 s with stopReason `cancelled`, measured live."
