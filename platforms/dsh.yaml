id: "dsh"
runtime_name: "dsh"
skill_name: "dsh-kaola-project-runner"
display_name: "dsh Kaola Project Runner"
short_description: "Communicate with dsh through exact tmux"
default_prompt: "Use $dsh-kaola-project-runner to start an exact dsh tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a dsh (DeepSeek Harness) main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "dsh-kaola"
binary_name: "dsh"
binary_env: "DSH_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/resume <session-id> over ACP"
preflight_summary: "Verify the dsh executable, report `dsh --version` and whether an `acp` profile exists under $DSH_HOME, and never write anything under that home."
launch_summary: "Launch `dsh --profile acp`, the shipped automation-only ACP v1 stdio server; there is no PTY transport for this platform and the acp profile accepts no application arguments. The profile bundle pins provider deepseek-official and ignores the user's agent-default-model, so a session can start ready and still fail its first prompt with `no API key for provider route \"deepseek-official\"`: supply DEEPSEEK_API_KEY in the environment or pass --model to select a credentialed route. The Runner default preset selects opencode-go/deepseek-v4.1-flash, whose ACP wire value is the JSON-encoded pair [\"opencode-go\",\"deepseek-v4.1-flash\"] already carried by acp_model_map; \"DeepSeek V4.1 Flash (OpenCode Go)\" is a Runner-side display name, not a catalog string -- the catalog's own display name is the bare lowercase deepseek-v4.1-flash, and the similarly spelled deepseek-official/deepseek-flash (displayed \"DeepSeek-V41-Flash\") is a different route. Because the shipped profile pins deepseek-official, this opencode-go default now needs its own credentialed provider on the ordinary path. dsh's ACP composition never sends session/request_permission; its permission mode is the launch variable DSH_PERMISSION_MODE, and the Runner starts dsh with danger-full-access (no Seatbelt sandbox, approval never) \u2014 the same full-access default as every other platform's measured bypass \u2014 unless the caller sets DSH_PERMISSION_MODE or passes --mode (read-only, workspace-write or danger-full-access; bypassPermissions maps to danger-full-access). A caller that wants the sandbox sets it explicitly: under dsh's own default workspace-write, shell writes outside the workspace, /tmp and $TMPDIR are denied, and a Runner start run from that shell inherits the sandbox (Issue #120). The Issue #98 outside-workspace probe wrote to /tmp, which is inside that writable set."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "DeepSeek V4.1 Flash (OpenCode Go)"
default_model_id: "opencode-go/deepseek-v4.1-flash"
default_model_parameters: "no Runner effort override"
default_model_effort: ""
upgrade_model_name: "DeepSeek V4.1 Flash (OpenCode Go)"
upgrade_model_id: "opencode-go/deepseek-v4.1-flash"
upgrade_model_parameters: "no Runner effort override"
upgrade_model_effort: ""
alt_tier_label: ""
