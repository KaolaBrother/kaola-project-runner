id: "devin"
runtime_name: "Devin CLI"
skill_name: "devin-kaola-project-runner"
display_name: "Devin CLI Kaola Project Runner"
short_description: "Communicate with Devin CLI through exact ACP"
default_prompt: "Use $devin-kaola-project-runner to start an exact Devin CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Devin CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "devin-kaola"
binary_name: "devin"
binary_env: "DEVIN_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the Devin executable and report optional Kaola carrier and skill evidence without gating communication."
launch_summary: "ACP runs devin acp, each tier spawned with its preset --model (acp_command_<tier>, Issue #140); ACP start sets mode=bypass after initialize."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "SWE-2 Max"
default_model_id: "swe-2-max"
default_model_parameters: "effort=max (encoded in model ID)"
default_model_effort: ""
default_model_profile: "Very low-cost, capable full-cycle engineering worker."
default_model_class: "Worker"
named_tiers: "opus-fusion,fable"
opus_fusion_model_name: "Opus Fusion (Opus 5.5 Medium + SWE-2 Medium)"
opus_fusion_model_id: "fusion-claude-opus-5-5-medium-sidekick-swe-2-medium"
opus_fusion_model_parameters: "effort=medium (encoded in model ID)"
opus_fusion_model_effort: ""
opus_fusion_model_profile: "All-round worker for every kind of task, especially strong at complex work."
opus_fusion_model_class: "Elite"
fable_model_name: "Fable Fusion (Fable 5.1 High + SWE-2 Medium)"
fable_model_id: "fusion-claude-fable-5-1-high-sidekick-swe-2-medium"
fable_model_parameters: "effort=high (encoded in model ID)"
fable_model_effort: ""
fable_model_profile: "Design, goal definition and decomposition, issue creation, and review; only with explicit user permission for each task; no concrete implementation or execution, not a regular worker."
fable_model_class: "Expert"
fast_support: "model-variant"
fast_summary: "Fast via catalog `-fast`/`-priority` model variants only when the resolved model advertises one; preset models have no fast variant"
acp_command: "devin acp"
acp_command_default: "devin acp --model swe-2-max"
acp_command_opus_fusion: "devin acp --model fusion-claude-opus-5-5-medium-sidekick-swe-2-medium"
acp_command_fable: "devin acp --model fusion-claude-fable-5-1-high-sidekick-swe-2-medium"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "agent reports affogato 0.0.0-dev; the ACP model option offers only 76 of the catalog values on cli 3000.11.1 and rejects the presets with -32602, so each tier sets its preset through acp_command_<tier> spawn argv --model (Issue #140); the advertised model option does not echo, and need not list, that argv id, so its currentValue is not the running model (Issue #197: a default seat advertised swe-2-high while Devin's native sessions.db recorded swe-2-max, and an opus-fusion seat advertised the -high fusion id), and the Runner reads no native store, so the actual model stays unknown; both non-default tiers are fusion models (Issue #144): --tier opus-fusion is fusion-claude-opus-5-5-medium-sidekick-swe-2-medium (main Opus effort medium, Issue #190; the #144-measured id was the -high variant; Devin's native sessions.db records this -medium id for an opus-fusion session, Issue #197), and --tier fable is fusion-claude-fable-5-1-high-sidekick-swe-2-medium, replacing the retired pure claude-fable-5-1-high; there is no effort config option, so every effort is encoded in the model id"
acp_verified_versions: "cli=3000.11.1;protocol=1;agent=0.0.0-dev"
acp_env_allowlist: "DEVIN_API_KEY"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "`start` sets ACP `mode=bypass`; `--permission-mode MODE` sets another advertised `mode` value"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "No steering entry on the ACP surface: all four candidate methods answer JSON-RPC -32601 on cli 3000.10.21 (agent affogato 0.0.0-dev) and `initialize` advertises no steering `_meta`, only the `cognition.ai/*` extension set."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"max\",\"name\":\"Max\",\"windows\":[\"weekly\"]},{\"id\":\"overage\",\"name\":\"Overage\",\"binds_models\":false,\"windows\":null}]"
model_package_rule: "{\"kind\":\"single\",\"package\":\"max\"}"
