id: "devin"
runtime_name: "Devin CLI"
skill_name: "devin-kaola-project-runner"
display_name: "Devin CLI Kaola Project Runner"
short_description: "Communicate with Devin CLI through exact ACP"
default_prompt: "Use $devin-kaola-project-runner to start an exact Devin CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Devin CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "devin-kaola"
binary_name: "devin"
binary_env: "DEVIN_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the Devin executable and report optional Kaola carrier and skill evidence without gating communication."
launch_summary: "Launch devin from the canonical repository root with --permission-mode dangerous (default) and --respect-workspace-trust false. ACP start sets mode=bypass."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "SWE-2 Max"
default_model_id: "swe-2-max"
default_model_parameters: "effort=max (encoded in model ID)"
default_model_effort: ""
upgrade_model_name: "Fusion High (Opus 5.5 High + SWE-2 Medium)"
upgrade_model_id: "fusion-claude-opus-5-5-high-sidekick-swe-2-medium"
upgrade_model_parameters: "effort=high (encoded in model ID)"
upgrade_model_effort: ""
alt_tier_label: "fable"
alt_model_name: "Fusion High (Fable 5.1 High + SWE-2 Medium)"
alt_model_id: "fusion-claude-fable-5-1-high-sidekick-swe-2-medium"
alt_model_parameters: "effort=high (encoded in model ID)"
alt_model_effort: ""
fast_support: "model-variant"
fast_summary: "Fast via catalog `-fast`/`-priority` model variants only when the resolved model advertises one; preset models have no fast variant"
acp_command: "devin acp"
acp_command_default: "devin acp --model swe-2-max"
acp_command_upgrade: "devin acp --model fusion-claude-opus-5-5-high-sidekick-swe-2-medium"
acp_command_alt: "devin acp --model fusion-claude-fable-5-1-high-sidekick-swe-2-medium"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "agent reports affogato 0.0.0-dev; the ACP model option offers only 76 of the catalog values on cli 3000.11.1 and rejects the presets with -32602, so each tier sets its preset through acp_command_<tier> spawn argv --model (Issue #140) and the advertised model currentValue stays the stale initial swe-2-high; both non-default tiers are fusion models (Issue #144): --tier upgrade is fusion-claude-opus-5-5-high-sidekick-swe-2-medium because the catalog has no pure Opus 5.5 High (pure Opus 5.5 is medium only), and --tier fable is fusion-claude-fable-5-1-high-sidekick-swe-2-medium, replacing the retired pure claude-fable-5-1-high; there is no effort config option, so every effort is encoded in the model id"
acp_verified_versions: "cli=3000.11.1;protocol=1;agent=0.0.0-dev"
acp_env_allowlist: "DEVIN_API_KEY"
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "No steering entry on the ACP surface: all four candidate methods answer JSON-RPC -32601 on cli 3000.10.21 (agent affogato 0.0.0-dev) and `initialize` advertises no steering `_meta`, only the `cognition.ai/*` extension set."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"max\",\"name\":\"Max\"},{\"id\":\"overage\",\"name\":\"Overage\",\"binds_models\":false}]"
model_package_rule: "{\"kind\":\"single\",\"package\":\"max\"}"
