session_prefix: "claude-code-kaola"
binary_name: "claude"
binary_env: "CLAUDE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Require workflow-next and kaola-workflow-finalize in the nearest project or user Claude command carrier; do not install them automatically."
launch_summary: "Launch claude from the canonical repository root."
recurring_execution: "unsupported"
recurring_summary: "Do not map goals, background agents, or other Claude features to recurring execution until a same-main-conversation lifecycle is live-proven."
quit_text: "/exit"
