id: "claude-code"
runtime_name: "Claude Code"
skill_name: "claude-code-kaola-project-runner"
display_name: "Claude Code Kaola Project Runner"
short_description: "Run Kaola Workflow projects through Claude Code"
default_prompt: "Use $claude-code-kaola-project-runner to start workflow-next immediately in the current Git repository."
description: "Use when Codex should run Kaola Workflow through a Claude Code main conversation in an exact tmux session. A bare invocation uses the current Git repository and starts workflow-next so it can select the most appropriate Issue batch."
session_prefix: "claude-code-kaola"
binary_name: "claude"
binary_env: "CLAUDE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Require workflow-next and kaola-workflow-finalize in the nearest project or user Claude command carrier; do not install them automatically."
launch_summary: "Launch Claude from the canonical repository root through the measured fresh-session flow in [launch.md](launch.md); do not repair sessions with raw tmux commands or UI key cycling."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified Claude-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
