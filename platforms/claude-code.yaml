id: "claude-code"
runtime_name: "Claude Code"
skill_name: "claude-code-kaola-project-runner"
display_name: "Claude Code Kaola Project Runner"
short_description: "Communicate with Claude Code through exact tmux"
default_prompt: "Use $claude-code-kaola-project-runner to start an exact Claude Code tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Claude Code main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "claude-code-kaola"
binary_name: "claude"
binary_env: "CLAUDE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the Claude executable and report optional Kaola carrier and launch-option evidence without gating communication."
launch_summary: "Launch Claude from the canonical repository root with --permission-mode bypassPermissions (default). ACP runs the vendored claude-code-acp bridge (node, Skill-relative dist) that drives the exact claude binary as one subscription subprocess per turn; ACP start sets mode=bypassPermissions after a working initialize."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified Claude-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Opus High"
default_model_id: "opus"
default_model_parameters: "effort=high"
default_model_effort: "high"
upgrade_model_name: "Fable High"
upgrade_model_id: "fable"
upgrade_model_parameters: "effort=high"
upgrade_model_effort: "high"
fast_support: "settings"
fast_summary: "Fast via process-scoped `--settings '{\"fastMode\": ...}'` at launch: `--fast on` passes fastMode=true, `--fast off` pins fastMode=false for the session; the native CLI determines model support — effective stays unknown without native evidence and the selected model is never changed"
default_transport: "acp"
acp_command: "node $SKILL_DIR/scripts/vendor/claude-code-acp/dist/index.js"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "vendored pinned fork of harukitosa/claude-code-acp (MIT), never the npm registry package or npx; one claude -p subprocess per turn, later turns pass --resume; the bridge drops ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN so the subscription login and native Settings resolve inside claude; login itself stays a PTY act; permit settles only the reported tool_call status because the claude -p child has no stdin and no --permission-prompt-tool, so a permission answer cannot gate or resume the child (cli 2.1.272 emitted no permission_request in bypassPermissions or manual mode)"
acp_verified_versions: "cli=2.1.272;bridge=6c20f28;protocol=1"
acp_env_allowlist: "CLAUDE_BIN,CLAUDE_CONFIG_DIR"
acp_login_requires_pty: "true"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: "fast"
acp_fast_values: ""
acp_model_map: ""
