id: "kimi-cli"
runtime_name: "Kimi CLI"
skill_name: "kimi-cli-kaola-project-runner"
display_name: "Kimi CLI Kaola Project Runner"
short_description: "Communicate with Kimi CLI through exact ACP"
default_prompt: "Use $kimi-cli-kaola-project-runner to start an exact Kimi CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Kimi Code CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "kimi-cli-kaola"
binary_name: "kimi"
binary_env: "KIMI_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the Kimi executable and report optional Kaola carrier/doctor evidence without gating communication."
launch_summary: "ACP runs kimi acp; ACP start sets mode=yolo after initialize and applies effort through the ACP thinking config option, whose ladder is low/high/max rather than the five-level KIMI_MODEL_THINKING_EFFORT env ladder (low/medium/high/xhigh/max) -- max is valid on both, but the two sets are not the same. The selected preset's model and thinking are applied explicitly at start and never inherited from the ACP current value: default is model=kimi-code/kimi-for-coding plus thinking=max, and --tier kimi-k3-1-pro pins kimi-code/k3.1-pro (the catalog carries no \"Max\" in any display name)."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Kimi K2.8"
default_model_id: "kimi-code/kimi-for-coding"
default_model_parameters: "thinking=max"
default_model_effort: "max"
default_model_profile: "All-round implementation worker for every kind of hands-on development and implementation task."
default_model_class: "Elite"
named_tiers: "kimi-k3-1-pro"
kimi_k3_1_pro_model_name: "Kimi K3.1 Pro"
kimi_k3_1_pro_model_id: "kimi-code/k3.1-pro"
kimi_k3_1_pro_model_parameters: "thinking=max"
kimi_k3_1_pro_model_effort: "max"
kimi_k3_1_pro_model_profile: "Strong all round worker. Strong at visual design and visual inspection, with good UI and design taste."
kimi_k3_1_pro_model_class: "Elite"
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as kimi-code/kimi-for-coding-highspeed are explicit model choices, not a Fast switch"
acp_command: "kimi acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: ""
acp_verified_versions: "cli=2.2.0;protocol=1"
acp_env_allowlist: "KIMI_API_KEY,KIMI_BASE_URL"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "`start` sets ACP `mode=yolo`; `--permission-mode MODE` sets another advertised `mode` value"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "thinking"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "session/prompt"
steering_summary: "CLI 2.1.1 has native submitSteer/SDK session.steer, but its ACP prompt handler rejects a concurrent prompt with turn.agent_busy (-32600). KPR holds input until the current prompt ends, then sends one ordinary session/prompt on the same session without cancel, stop or restart. This supports later-turn processing, not immediate native injection. holder-queued is process-local admission only. Read steer_followup and subsequent session output. A competing prompt can refuse the write; stopped holders lose pending input. Neither case causes silent replay."
host_skill_entry: "/skill:kaola-project-runner "
quota_packages: "[{\"id\":\"managed\",\"name\":\"Managed (weekly + monthly)\",\"windows\":[\"weekly\",\"monthly\"]},{\"id\":\"managed_monthly\",\"name\":\"Managed (monthly only)\",\"windows\":[\"monthly\"],\"binds_models\":false}]"
model_package_rule: "{\"kind\":\"provider_prefix\",\"providers\":{\"kimi-code\":\"managed\"}}"
steering_delivery: "after-turn"
