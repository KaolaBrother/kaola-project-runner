id: "kimi-cli"
runtime_name: "Kimi CLI"
skill_name: "kimi-cli-kaola-project-runner"
display_name: "Kimi CLI Kaola Project Runner"
short_description: "Communicate with Kimi CLI through exact ACP"
default_prompt: "Use $kimi-cli-kaola-project-runner to start an exact Kimi CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Kimi Code CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "kimi-cli-kaola"
binary_name: "kimi"
binary_env: "KIMI_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the Kimi executable and report optional Kaola carrier/doctor evidence without gating communication."
launch_summary: "Launch kimi --yolo from the canonical repository root. On Kimi Code CLI 2.x --yolo is Ask When Needed (routine edits and commands auto-run; risky actions, questions, and plans still ask) and is mutually exclusive with --auto (Never Ask), which the Runner no longer passes; --yes/--auto-approve are hidden aliases of --yolo. Runner --resume renders --session <session-id> (-r/--resume is a hidden alias) and Runner --continue renders --continue; 2.x rejects --session together with --continue at startup because both mean resume, so the Runner sends at most one. Thinking effort travels through thinking.effort (env KIMI_MODEL_THINKING_EFFORT: low/medium/high/xhigh/max), not a reasoning_effort wire parameter; ACP start sets mode=yolo and applies effort through the ACP thinking config option, whose ladder is the three values low/high/max rather than that five-level env ladder -- max is valid on both, but the two sets are not the same. The ACP model currentValue is kimi-code/kimi-for-coding, so the kimi-code/k3 default preset is applied, never inherited, and \"Kimi K3 Max\" names the composition model=kimi-code/k3 plus thinking=max: the catalog carries no \"Max\" in any display name. Workspace-trust remains a separate TUI surface."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Kimi K3 Max"
default_model_id: "kimi-code/k3"
default_model_parameters: "thinking=max"
default_model_effort: "max"
upgrade_model_name: "Kimi K3 Max"
upgrade_model_id: "kimi-code/k3"
upgrade_model_parameters: "thinking=max"
upgrade_model_effort: "max"
alt_tier_label: "alternative"
alt_model_name: "Kimi K2.8"
alt_model_id: "kimi-code/kimi-for-coding"
alt_model_parameters: "thinking=max"
alt_model_effort: "max"
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as kimi-code/kimi-for-coding-highspeed are explicit model choices, not a Fast switch"
acp_command: "kimi acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: ""
acp_verified_versions: "cli=2.0.2;protocol=1"
acp_env_allowlist: "KIMI_API_KEY,KIMI_BASE_URL"
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "thinking"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "Kimi Code CLI 2.0.2 advertises no steering `_meta`; all four candidate ACP methods (`_session/steering`, `session/steering`, `session/steer`, `_session/steer`) answer JSON-RPC -32601. Use explicit `--steer-mode interrupt` to cancel the active turn and continue on the same session; this is not mid-turn injection."
host_skill_entry: "/skill:kaola-project-runner "
quota_packages: "[{\"id\":\"managed\",\"name\":\"Managed\"}]"
model_package_rule: "{\"kind\":\"provider_prefix\",\"providers\":{\"kimi-code\":\"managed\"}}"
