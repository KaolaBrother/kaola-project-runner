id: "kimi-cli"
runtime_name: "Kimi CLI"
skill_name: "kimi-cli-kaola-project-runner"
display_name: "Kimi CLI Kaola Project Runner"
short_description: "Communicate with Kimi CLI through exact tmux"
default_prompt: "Use $kimi-cli-kaola-project-runner to start an exact Kimi CLI tmux session, read its output, and send only the input I choose."
description: "Use when Codex should communicate with a Kimi Code CLI main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "kimi-cli-kaola"
binary_name: "kimi"
binary_env: "KIMI_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the Kimi executable and report optional Kaola carrier/doctor evidence without gating communication."
launch_summary: "Launch kimi --auto from the canonical repository root. ACP start sets mode=yolo. Workspace-trust remains a separate TUI surface."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Kimi K3 Max"
default_model_id: "kimi-code/k3"
default_model_parameters: "effort=max"
default_transport: "acp"
acp_command: "kimi acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: ""
acp_verified_versions: "cli=0.41.0;protocol=1"
acp_env_allowlist: "KIMI_API_KEY,KIMI_BASE_URL"
acp_login_requires_pty: "false"
acp_model_config_id: "model"
acp_effort_config_id: "thinking"
acp_wrapper_pin: ""
