id: "kimi-cli"
runtime_name: "Kimi CLI"
skill_name: "kimi-cli-kaola-project-runner"
display_name: "Kimi CLI Kaola Project Runner"
short_description: "Run Kaola Workflow projects through Kimi CLI"
default_prompt: "Use $kimi-cli-kaola-project-runner to start workflow-next immediately in the current Git repository."
description: "Use when Codex should run Kaola Workflow through a Kimi Code CLI main conversation in an exact tmux session. A bare invocation uses the current Git repository and starts workflow-next so it can select the most appropriate Issue batch."
session_prefix: "kimi-cli-kaola"
binary_name: "kimi"
binary_env: "KIMI_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Require workflow-next and kaola-workflow-finalize in project or user Kimi Skill carriers and validate current Kimi configuration health."
launch_summary: "Launch kimi from the canonical repository root."
recurring_execution: "unsupported"
recurring_summary: "Do not map goal mode or background agents to recurring execution until the same-main-conversation lifecycle is live-proven."
quit_text: "/exit"
