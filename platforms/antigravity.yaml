id: "antigravity"
runtime_name: "Antigravity"
skill_name: "antigravity-kaola-project-runner"
display_name: "Antigravity Kaola Project Runner"
short_description: "Communicate with Antigravity through exact ACP"
default_prompt: "Use $antigravity-kaola-project-runner to start an exact Antigravity ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an Antigravity (agy) main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "antigravity-kaola"
binary_name: "agy"
binary_env: "AGY_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/resume <conversation-id> over ACP (agy --conversation)"
preflight_summary: "Verify the agy executable and report `agy --version`; never run a model turn and never write under ~/.gemini. Sign-in is not a preflight fact: the probe session/new reports login_required from agy's own start-up refusal."
launch_summary: "The local ACP adapter runs the exact AGY_BIN as one long-lived `agy --input-format stream-json --output-format stream-json --print-timeout 0s` child per session, with --model and --dangerously-skip-permissions applied from the ACP model and mode options. Effort is baked into the model id (gemini-4-argon-{low,medium,high}); the adapter never passes --effort, so effort cannot be applied twice. A sign-in or account-eligibility refusal is reported as login-required with the browser verify URL."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Gemini 4 Argon"
default_model_id: "gemini-4-argon-medium"
default_model_parameters: "effort=medium (encoded in model ID)"
default_model_effort: "medium"
default_model_profile: "Strong implementation worker for well-scoped build tasks: features, UI and 3D, frontend and backend code, refactors, and tests. Strong language expression in English and Chinese. Sometimes reports work, files, or results that do not exist, so every output must be independently reviewed by another seat before it is accepted. Never use as a reviewer, verifier, or for acceptance decisions."
default_model_class: "Elite"
named_tiers: "xhigh,opus"
xhigh_model_name: "Gemini 4 Argon"
xhigh_model_id: "gemini-4-argon-high"
xhigh_model_parameters: "effort=high (encoded in model ID)"
xhigh_model_effort: "high"
xhigh_model_profile: "Higher-effort Argon tier for harder or larger implementation tasks; slower and uses more quota. Strong language expression in English and Chinese. Same limits: every output must be independently reviewed by another seat before it is accepted, and it must never be used as a reviewer, verifier, or for acceptance decisions."
xhigh_model_class: "Elite"
opus_model_name: "Claude Opus 5.5"
opus_model_id: "claude-opus-5-5-high"
opus_model_parameters: "effort=high (encoded in model ID)"
opus_model_effort: "high"
opus_model_profile: "Strong at UI and 3D design implementation only; Opus level for UI and 3D work that needs more depth than the Argon tiers. Strong language expression in English and Chinese within UI and 3D implementation. Do not use for any other task (research, design docs, review, backend, debugging, investigation)."
opus_model_class: "Elite"
fast_support: "none"
fast_summary: "no native Fast toggle; the catalog's low, medium and high slugs are explicit model choices, not a Fast switch"
acp_command: "python3 $SKILL_DIR/scripts/kaola-antigravity-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "in-repo adapter over agy's headless stream-json protocol (no official ACP, no third-party bridge); one agy child per ACP session, started at session/new so an unsigned account refuses there, and replaced before the next prompt when model or mode changed; sessionCapabilities is {resume,close}, resume is agy --conversation <conversation_id> carried by session/resume, and native_session_identity announces the native id; session/list, session/load and Runner --continue are unsupported by this ACP route (native agy separately advertises --continue); model and mode are the only config options, effort is part of the model id and the adapter never passes --effort; tested stream-json control_request and CLI-local /usage end agy with ERROR, finished_reason=error and exit 2; mid-turn stdin user events run after the active turn on the same process and are coalesced behind _session/steering, whose written/write-only result proves admission rather than consumption and whose idle result is promptRequired; live SIGINT returns ERROR/interrupted with finished_reason=interrupted and exit 1 while retaining the on-disk conversation, so cancel settles as cancelled and the next prompt respawns with --conversation; finished_reason=print_timeout or error is incomplete even when status is SUCCESS, and interrupted settles as cancelled including when a steer is queued; metadata retains finished_reason and incomplete partial_response; one-shot agy -p /usage --output-format json reports 0 turns and 0 tokens with command.data.groups containing two groups and four buckets (gemini-weekly, gemini-5h, 3p-weekly, 3p-5h), remaining_fraction in [0,1] and RFC3339 reset_time; each result._meta.antigravity.usage carries native conversation-cumulative usage rather than a per-turn delta; the adapter itself does not write ~/.gemini, but the native CLI may persist its own data; one-turn, two-turn, model/mode replacement, close/resume, mid-turn steer, cancel/interrupt+resume and quota were verified live on agy 1.4.12 on 2026-10-31, with final-candidate direct/launchd six-key proxy isolation and focused finished_reason verification; the initial native id is provisional when first-prompt model/mode application replaces the child, so use the last native_session_identity for resume"
# Bounded verification: MacBook, Darwin ARM, agy 1.4.12.
# Evidence: Issue #435 final Expert report, 2026-10-31; candidate 4414c26f6b100443ea2ee186b68d2c2cf5fed08e.
# Reuses the unchanged normal-protocol live evidence identified in that report.
# Direct/launchd proxy isolation and exact stop were measured on the final candidate.
# finished_reason coverage combines live timeout/cancel evidence with focused fixtures.
# Mini/Studio, other CLI versions and unmeasured model/Host capabilities are not covered.
# This records compatibility evidence; it is not an installation, restart or transport gate.
acp_verified_versions: "cli=1.4.12;protocol=1;condition=live-one-turn-two-turn-model-mode-resume-steer-cancel-interrupt-resume-usage-direct-launchd-proxy-isolation-finished-reason"
acp_env_allowlist: "AGY_BIN"
acp_login_requires_pty: "false"
login_summary: "Login is a human act in agy's own browser flow; an account that agy reports as not eligible needs the verify URL in the login-required receipt, and the Runner never signs in or retries credentials."
permission_summary: "`start` sets mode bypassPermissions, which launches agy with --dangerously-skip-permissions; headless agy has no approval prompt and soft-denies shell commands otherwise. `--permission-mode default` keeps agy's request-review mode."
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "Mid-turn steering over _session/steering in kaola-antigravity-acp.py (live on agy 1.4.12, 2026-10-31, Issue #435): tested stream-json control_request and CLI-local /usage terminate the native process with exit 2; a mid-turn user event on stdin is buffered and runs on the same process after the active turn. The adapter coalesces it under the active ACP session/prompt id and reports written/write-only, which is admission rather than confirmed consumption. Leading slash text is refused (-32602). When idle, _session/steering returns promptRequired. Interrupt sends SIGINT; the measured native result is ERROR/interrupted with finished_reason=interrupted and exit 1, and the next prompt resumes through --conversation. A queued steer does not prevent interrupted settlement. Timeout/error finished_reason is incomplete, not normal success."
host_skill_entry: ""
quota_packages: "[{\"id\":\"account\",\"name\":\"Account\",\"windows\":[\"5h\",\"weekly\"]}]"
model_package_rule: "{\"kind\":\"single\",\"package\":\"account\"}"
