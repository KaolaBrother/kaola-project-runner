id: "antigravity"
runtime_name: "Antigravity"
skill_name: "antigravity-kaola-project-runner"
display_name: "Antigravity Kaola Project Runner"
short_description: "Communicate with Antigravity through exact ACP"
default_prompt: "Use $antigravity-kaola-project-runner to start an exact Antigravity ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an Antigravity (agy) main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "antigravity-kaola"
binary_name: "agy"
binary_env: "AGY_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/resume <conversation-id> over ACP (agy --conversation)"
preflight_summary: "Verify the agy executable and report `agy --version`; never run a model turn and never write under ~/.gemini. Sign-in is not a preflight fact: the probe session/new reports login_required from agy's own start-up refusal."
launch_summary: "The local ACP adapter runs the exact AGY_BIN as one long-lived `agy --input-format stream-json --output-format stream-json --print-timeout 0s` child per session, with --model and --dangerously-skip-permissions applied from the ACP model and mode options. Effort is baked into the model id (gemini-4-argon-{low,medium,high}); the adapter never passes --effort, so effort cannot be applied twice. A sign-in or account-eligibility refusal is reported as login-required with the browser verify URL."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Gemini 4 Argon"
default_model_id: "gemini-4-argon-medium"
default_model_parameters: "effort=medium (encoded in model ID)"
default_model_effort: "medium"
default_model_profile: "High-throughput, multimodal agentic implementer. Think senior generalist engineer, strong on coding, long context, and parallel agent work, with a real creative streak in interactive front-end and 3D. Best with a clear brief and a defined 'done'."
default_model_class: "Elite"
named_tiers: "xhigh"
xhigh_model_name: "Gemini 4 Argon"
xhigh_model_id: "gemini-4-argon-high"
xhigh_model_parameters: "effort=high (encoded in model ID)"
xhigh_model_effort: "high"
xhigh_model_profile: "Escalation level: use it when Argon medium cannot solve the task, especially hard debugging that needs a root-cause fix or long multi-step work. Slower and uses more quota."
xhigh_model_class: "Elite"
fast_support: "none"
fast_summary: "no native Fast toggle; the catalog's low, medium and high slugs are explicit model choices, not a Fast switch"
acp_command: "python3 $SKILL_DIR/scripts/kaola-antigravity-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "in-repo adapter over agy's headless stream-json protocol (no official ACP, no third-party bridge); one agy child per ACP session, started at session/new so an unsigned account refuses there, and replaced before the next prompt when model or mode changed; sessionCapabilities is {resume,close}, resume is agy --conversation <conversation_id> carried by session/resume, and the native conversation id is announced by native_session_identity; session/list, session/load and --continue are unsupported; model and mode are the only config options, effort is part of the model id and the adapter never passes --effort; control_request and slash commands in stream-json end an agy session (exit 2), whereas a mid-turn user event on stdin is accepted by agy's stream reader and runs immediately after the current turn on the same process (coalesced by the adapter behind _session/steering); SIGINT ends the active agy process with status ERROR (error: interrupted, exit 1) while preserving the conversation on disk, so session/cancel settles as cancelled and the next prompt respawns with --conversation; account quota is read via one-shot print mode agy -p /usage --output-format json (alias /quota, 0 turns, 0 tokens, no ~/.gemini write), returning command.data.groups (Gemini Models: gemini-weekly and gemini-5h; third-party model families: 3p-weekly and 3p-5h) with remaining_fraction in [0,1] and RFC3339 reset_time, while per-turn token counts ride result._meta.antigravity.usage; the adapter never writes ~/.gemini; one-turn, two-turn, resume, mid-turn steer, cancel/interrupt+resume and /usage quota were verified live on agy 1.3.5 (2026-10-14/15); agy prints its first init at start but the child is replaced before the first prompt when mode or model is applied, so the native id announced at start is provisional (resuming it opens an empty conversation) and the last native_session_identity is the resumable one"
acp_verified_versions: "cli=1.3.5;protocol=1;condition=live-one-turn-two-turn-resume-steer-cancel-usage"
acp_env_allowlist: "AGY_BIN"
acp_login_requires_pty: "false"
login_summary: "Login is a human act in agy's own browser flow; an account that agy reports as not eligible needs the verify URL in the login-required receipt, and the Runner never signs in or retries credentials."
permission_summary: "`start` sets mode bypassPermissions, which launches agy with --dangerously-skip-permissions; headless agy has no approval prompt and soft-denies shell commands otherwise. `--permission-mode default` keeps agy's request-review mode."
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "Mid-turn steering over `_session/steering` in `kaola-antigravity-acp.py` (live on agy 1.3.5, Issue #328): stream-json `control_request` and `/` commands end the session (exit 2), while a mid-turn `user` event on stdin is buffered by agy and runs on the same process right after the active turn. The adapter writes the `user` event to stdin, coalesces the queued agy turn under the active ACP `session/prompt` id, and reports `written` (`write-only`). Leading `/` text is refused (`-32602`). Once the native turn settles, `_session/steering` returns `promptRequired`, composing with the holder's settle-window queue (#326). `--steer-mode interrupt` sends `SIGINT` (`status: ERROR, error: interrupted`, exit 1) and resumes via `--conversation`."
host_skill_entry: ""
quota_packages: "[{\"id\":\"account\",\"name\":\"Account\",\"windows\":[\"5h\",\"weekly\"]}]"
model_package_rule: "{\"kind\":\"single\",\"package\":\"account\"}"
