id: "cursor-cli"
runtime_name: "Cursor CLI"
skill_name: "cursor-cli-kaola-project-runner"
display_name: "Cursor CLI Kaola Project Runner"
short_description: "Communicate with Cursor CLI through exact tmux"
default_prompt: "Use $cursor-cli-kaola-project-runner to start an exact Cursor CLI tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Cursor Agent CLI main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "cursor-cli-kaola"
binary_name: "cursor-agent"
binary_env: "CURSOR_AGENT_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <chat-id>"
preflight_summary: "Verify the Cursor executable and report optional global/project Workflow command evidence without gating communication."
launch_summary: "Launch cursor-agent --workspace <repo> --yolo without materializing or modifying project files. ACP process is cursor-agent --yolo acp; configOptions.mode has no skip-all value."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Grok 4.6 Extra High"
default_model_id: "cursor-grok-4.6-xhigh"
default_model_parameters: "effort=xhigh (encoded in model ID), fast=false"
default_model_effort: "xhigh"
upgrade_model_name: "Claude Fable 5.1 High"
upgrade_model_id: "claude-fable-5-1-high"
upgrade_model_parameters: "effort=high (encoded in model ID)"
upgrade_model_effort: "high"
fast_support: "model-variant+acp-config"
fast_summary: "Fast via native `-fast` PTY picker variants (e.g. cursor-grok-4.6-xhigh-fast); over ACP the parameterized `fast` option (true/false strings) applies to any model; unsupported PTY variants reported rather than invented"
default_transport: "acp"
acp_command: "cursor-agent --yolo acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "agentInfo is empty; initialize with _meta.parameterizedModelPicker=true so ACP advertises separate model/effort/fast options (base model IDs, effort low..xhigh, fast true/false strings); picker IDs decompose via acp_model_map + effort suffix + fast option"
acp_verified_versions: "cli=2026.09.10-fd3934a;protocol=1"
acp_env_allowlist: "CURSOR_API_KEY"
acp_login_requires_pty: "false"
acp_init_meta: "parameterizedModelPicker=true"
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: "fast"
acp_fast_values: "off=false,on=true"
acp_model_map: "cursor-grok-4.6-xhigh=grok-4.6;cursor-grok-4.6-xhigh-fast=grok-4.6;claude-fable-5-1-high=claude-fable-5-1"
acp_wrapper_pin: ""
