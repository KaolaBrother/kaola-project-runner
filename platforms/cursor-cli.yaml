id: "cursor-cli"
runtime_name: "Cursor CLI"
skill_name: "cursor-cli-kaola-project-runner"
display_name: "Cursor CLI Kaola Project Runner"
short_description: "Communicate with Cursor CLI through exact ACP"
default_prompt: "Use $cursor-cli-kaola-project-runner to start an exact Cursor CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Cursor Agent CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "cursor-cli-kaola"
binary_name: "cursor-agent"
binary_env: "CURSOR_AGENT_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <chat-id>"
preflight_summary: "Verify the Cursor executable and report optional global/project Workflow command evidence without gating communication."
launch_summary: "ACP runs cursor-agent --yolo acp, initialized with _meta.parameterizedModelPicker=true; configOptions.mode has no skip-all value, so ACP start sets no mode."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Grok 4.7"
default_model_id: "grok-4.7-xhigh"
default_model_parameters: "effort=xhigh (encoded in model ID), fast=false"
default_model_effort: "xhigh"
default_model_profile: "Investigates unfamiliar problems, explores solution paths, and autonomously carries them through implementation; well suited to long-running, adaptive work."
default_model_class: "Elite"
named_tiers: "opus"
opus_model_name: "Claude Opus 5.5"
opus_model_id: "claude-opus-5-5-high"
opus_model_parameters: "effort=high (encoded in model ID)"
opus_model_effort: "high"
opus_model_profile: "All-round execution worker, especially strong at complex execution work and UI and 3D visual implementation."
opus_model_class: "Elite"
fast_support: "model-variant+acp-config"
fast_summary: "Fast via the ACP parameterized `fast` option (true/false strings), which applies to any model; a `-fast` catalog id (e.g. grok-4.7-xhigh-fast) decomposes onto that option; an unsupported variant is reported rather than invented"
acp_command: "cursor-agent --yolo acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "agentInfo is empty; initialize with _meta.parameterizedModelPicker=true so ACP advertises separate model/effort/fast options with base model IDs and string true/false fast values; the model-scoped option SET follows the selected model (the default preset advertises reasoning_effort, the opus preset effort), so the effort id is resolved from the options advertised after the model apply; the CLI persists the selected model and parameters in ~/.cursor/cli-config.json and a plain launch advertises that persisted schema"
acp_verified_versions: "cli=2026.09.18-9a7762b;protocol=1"
acp_env_allowlist: "CURSOR_API_KEY"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "the ACP command carries `--yolo` and ACP start sets no mode; `--permission-mode` has no ACP option to set and reports `config-option-unavailable`"
acp_init_meta: "parameterizedModelPicker=true"
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort;effort"
acp_fast_config_id: "fast"
acp_fast_values: "off=false,on=true"
acp_model_map: "grok-4.7-xhigh=grok-4.7;grok-4.7-xhigh-fast=grok-4.7;claude-opus-5-5-high=claude-opus-5-5;claude-opus-5-5-medium=claude-opus-5-5"
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "session/prompt"
steering_summary: "Native concurrent `session/prompt` cancels the original turn in CLI 2026.09.10-fd3934a. KPR therefore holds the input until the original prompt ends, then sends one ordinary `session/prompt` on the same session without cancel, stop or restart. This supports later-turn processing, not immediate native injection. holder-queued is process-local admission only. Read steer_followup for the native write and subsequent session output for processing. An intervening prompt can refuse the write; the receipt preserves that fact and nothing is silently replayed. The native steer exposure remains absent in the inspected ACP build."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"cursor-models\",\"name\":\"Cursor models\",\"windows\":[\"monthly\"]},{\"id\":\"other-models\",\"name\":\"Other models\",\"windows\":[\"monthly\"]}]"
model_package_rule: "{\"kind\":\"explicit\",\"map\":{\"auto\":\"cursor-models\",\"default\":\"cursor-models\",\"grok-4.7-xhigh\":\"cursor-models\",\"grok-4.7\":\"cursor-models\",\"grok-4.7-xhigh-fast\":\"cursor-models\",\"claude-opus-5-5-high\":\"other-models\",\"claude-opus-5-5-medium\":\"other-models\",\"claude-opus-5-5\":\"other-models\"}}"
steering_delivery: "after-turn"
