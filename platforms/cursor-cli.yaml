id: "cursor-cli"
runtime_name: "Cursor CLI"
skill_name: "cursor-cli-kaola-project-runner"
display_name: "Cursor CLI Kaola Project Runner"
short_description: "Run Kaola Workflow projects through Cursor CLI"
default_prompt: "Use $cursor-cli-kaola-project-runner to start workflow-next immediately in the current Git repository."
description: "Use when Codex should run Kaola Workflow through a Cursor Agent CLI main conversation in an exact tmux session. A bare invocation uses the current Git repository and starts workflow-next so it can select the most appropriate Issue batch."
session_prefix: "cursor-cli-kaola"
binary_name: "cursor-agent"
binary_env: "CURSOR_AGENT_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <chat-id>"
preflight_summary: "Require a current Kaola Cursor authority receipt and command surface; project catalog materialization remains an explicit Kaola point-of-use transaction."
launch_summary: "For a new exact session, run the installed Kaola Cursor authority's fail-closed --ensure-target transaction for the canonical repository, verify its receipt, then launch cursor-agent --workspace <repo>."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
