id: "droid"
runtime_name: "Droid"
skill_name: "droid-kaola-project-runner"
display_name: "Droid Kaola Project Runner"
short_description: "Communicate with Droid through exact tmux"
default_prompt: "Use $droid-kaola-project-runner to start an exact Droid tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Droid main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "droid-kaola"
binary_name: "droid"
binary_env: "DROID_BIN"
continue_syntax: "--resume --last"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the droid executable, report `droid --version` and read-only native settings facts (~/.factory/settings.json model/reasoningEffort) without gating communication."
launch_summary: "PTY launches droid with --skip-permissions-unsafe (default bypass) plus a process-scoped --settings overlay pinning the resolved model (default Auto Model; reasoningEffort only when explicitly called; never writes ~/.factory). ACP runs the native `droid exec --output-format acp` agent; ACP start sets model=auto and autonomy_level=auto-high after initialize/session-new (the default ACP session is already auto-high; the native default model id is not auto, so Auto Model is applied explicitly). Login stays a native act (TUI /login or FACTORY_API_KEY)."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/quit"
default_model_name: "Auto Model"
default_model_id: "auto"
default_model_parameters: ""
default_model_effort: ""
upgrade_model_name: "Auto Model"
upgrade_model_id: "auto"
upgrade_model_parameters: ""
upgrade_model_effort: ""
fast_support: "none"
fast_summary: "no separate Fast toggle; `-fast` catalog ids are explicit `--model` choices"
default_transport: "acp"
acp_command: "droid exec --output-format acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "native ACP agent (no bridge, no translator, acp_wrapper_pin empty); config options are declared in the session/new result, never initialize: model, reasoning_effort, autonomy_level (full bypass = auto-high); the default ACP session is already auto-high; launch flags do not shape ACP sessions; session/resume preferred and the native session id surfaces in the session/new result and session/list (resume/load do not echo it); auth stays native (device-pairing or FACTORY_API_KEY), never handled by the Runner"
acp_verified_versions: "cli=0.220.0;protocol=1"
acp_env_allowlist: ""
acp_login_requires_pty: "true"
acp_init_meta: ""
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
