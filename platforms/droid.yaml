id: "droid"
runtime_name: "Droid"
skill_name: "droid-kaola-project-runner"
display_name: "Droid Kaola Project Runner"
short_description: "Communicate with Droid through exact tmux"
default_prompt: "Use $droid-kaola-project-runner to start an exact Droid tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Droid main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "droid-kaola"
binary_name: "droid"
binary_env: "DROID_BIN"
continue_syntax: "--resume --last"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the droid executable, report `droid --version` and read-only native settings facts (~/.factory/settings.json model/reasoningEffort) without gating communication."
launch_summary: "PTY launches droid with --skip-permissions-unsafe (default bypass) plus a process-scoped --settings overlay pinning the resolved model (default Auto Model; reasoningEffort only when the preset or the caller names one; never writes ~/.factory). ACP runs the native `droid exec --output-format acp` agent; ACP start sets the resolved model and autonomy_level=auto-high after initialize/session-new (the default ACP session is already auto-high; the native default model currentValue is not auto, so the preset model is applied explicitly, never inherited). The default preset is the first-class catalog id auto with no effort pin; the --tier upgrade preset is the first-class catalog id kimi-k3 at reasoning_effort=max -- both accepted live on 0.220.0 against an agent that rejects an invalid effort with -32602 -- so no acp_model_map entry is needed. Login stays a native act (TUI /login or FACTORY_API_KEY)."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/quit"
default_model_name: "Auto Model"
default_model_id: "auto"
default_model_parameters: "no Runner effort override"
default_model_effort: ""
upgrade_model_name: "Kimi K3 Max"
upgrade_model_id: "kimi-k3"
upgrade_model_parameters: "reasoning_effort=max"
upgrade_model_effort: "max"
alt_tier_label: ""
alt_model_name: ""
alt_model_id: ""
alt_model_parameters: ""
alt_model_effort: ""
fast_support: "none"
fast_summary: "no separate Fast toggle; `-fast` catalog ids are explicit `--model` choices"
default_transport: "acp"
acp_command: "droid exec --output-format acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "native ACP agent (no bridge, no translator, acp_wrapper_pin empty); config options are declared in the session/new result, never initialize: model, reasoning_effort, autonomy_level (full bypass = auto-high); the default ACP session is already auto-high; the Runner's --permission-mode names translate onto autonomy values over ACP (bypassPermissions/high→auto-high, medium→auto-medium, low→auto-low, manual→normal) because the agent has no mode configId; launch flags do not shape ACP sessions; session/resume preferred and the native session id surfaces in the session/new result and session/list (resume/load do not echo it); auth stays native (device-pairing or FACTORY_API_KEY), never handled by the Runner"
acp_verified_versions: "cli=0.220.0;protocol=1"
acp_env_allowlist: ""
acp_login_requires_pty: "true"
acp_init_meta: ""
acp_mode_config_id: "autonomy_level"
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "No steering entry on the ACP surface: all four candidate methods answer JSON-RPC -32601 on @factory/cli 0.220.0 and `initialize` advertises no steering `_meta`. A second `session/prompt` during a live turn is accepted and both prompts settle `end_turn`, which is concurrent/queued turn handling, not documented active-turn injection; the Runner does not call it steering."
