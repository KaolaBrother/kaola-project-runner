id: "codex"
runtime_name: "Codex CLI"
skill_name: "codex-kaola-project-runner"
display_name: "Codex CLI Kaola Project Runner"
short_description: "Communicate with Codex CLI through exact tmux"
default_prompt: "Use $codex-kaola-project-runner to start an exact Codex CLI tmux session, read its output, and send only the input I choose."
description: "Use when Codex should communicate with a Codex CLI main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "codex-kaola"
binary_name: "codex"
binary_env: "CODEX_BIN"
continue_syntax: "resume --last"
resume_syntax: "resume <session-id>"
preflight_summary: "Verify the Codex executable and report optional Kaola Workflow skill or plugin carrier evidence without making Workflow availability a communication gate."
launch_summary: "Launch codex --cd <repo> --no-alt-screen with literal --model, -c model_reasoning_effort, and the mapped sandbox/approval pair (default agent-full-access). ACP process is the pinned npx codex-acp wrapper."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/quit"
default_model_name: "GPT-5.6 Luna Low"
default_model_id: "gpt-5.6-luna"
default_model_parameters: "effort=low"
default_transport: "acp"
acp_command: "npx --yes --package @openai/codex@0.153.4 --package @agentclientprotocol/codex-acp@1.11.0 codex-acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "adapter translates ACP stdio to Codex App Server; CODEX_PATH selects the Codex binary, otherwise its bundled @openai/codex pin; session capabilities advertise empty objects; native ACP mode read-only is upstream 'Ask for approval' (workspace-write + on-request, permits workspace writes) and agent is 'Approve for me' (auto_review) — strict OS read-only exists only via --transport pty"
acp_verified_versions: "cli=0.153.4;adapter=1.11.0;protocol=1"
acp_env_allowlist: "CODEX_API_KEY,OPENAI_API_KEY,CODEX_PATH"
acp_login_requires_pty: "false"
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_wrapper_pin: "1.11.0"
