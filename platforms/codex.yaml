id: "codex"
runtime_name: "Codex CLI"
skill_name: "codex-kaola-project-runner"
display_name: "Codex CLI Kaola Project Runner"
short_description: "Communicate with Codex CLI through exact ACP"
default_prompt: "Use $codex-kaola-project-runner to start an exact Codex CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Codex CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "codex-kaola"
binary_name: "codex"
binary_env: "CODEX_BIN"
continue_syntax: "resume --last"
resume_syntax: "resume <session-id>"
preflight_summary: "Verify the Codex executable and report optional Kaola Workflow skill or plugin carrier evidence without making Workflow availability a communication gate."
launch_summary: "Launch codex --cd <repo> --no-alt-screen with literal --model, -c model_reasoning_effort, and the mapped sandbox/approval pair (default agent-full-access). ACP process is the pinned npx codex-acp wrapper."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/quit"
default_model_name: "GPT-6 Sol High"
default_model_id: "gpt-6-sol"
default_model_parameters: "effort=high"
default_model_effort: "high"
upgrade_model_name: "GPT-6 Astra High"
upgrade_model_id: "gpt-6-astra"
upgrade_model_parameters: "effort=high"
upgrade_model_effort: "high"
alt_tier_label: ""
alt_model_name: ""
alt_model_id: ""
alt_model_parameters: ""
alt_model_effort: ""
fast_support: "config"
fast_summary: "Codex fast mode via ACP `fast-mode` configId (off/on); explicit off is applied, not assumed"
acp_command: "npx --yes --package @openai/codex@0.155.1 --package @agentclientprotocol/codex-acp@1.13.0 codex-acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "adapter translates ACP stdio to Codex App Server; CODEX_PATH selects the Codex binary, otherwise its bundled @openai/codex pin (live-measured 2026-09-23 on adapter 1.13.0: CODEX_PATH=/opt/homebrew/bin/codex, codex-cli 0.156.0, applies gpt-6-sol/high with high read back, a medium discriminator, and gpt-6-astra/high; the pinned npx default stays 0.155.1 and no portable 0.156.1 pin is claimed because npm 0.156.1 could not be installed on the measuring network); session capabilities advertise empty objects; native ACP mode read-only is upstream 'Ask for approval' (workspace-write + on-request, permits workspace writes) and agent is 'Approve for me' (auto_review) — ACP read-only is upstream on-request approval, not an OS sandbox; the Runner has no path to OS read-only"
acp_verified_versions: "cli=0.155.1;adapter=1.13.0;protocol=1"
acp_env_allowlist: "CODEX_API_KEY,OPENAI_API_KEY,CODEX_PATH"
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_session_new_timeout: "60"
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: "fast-mode"
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: "1.13.0"
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "Native ACP steering extension: adapters 1.11.0 and 1.13.0 advertise `_meta.steering.supported=true` at `initialize` and serve `_session/steering`, returning `injected` while a turn runs (live on 1.11.0: the original `session/prompt` still settled `end_turn` and absorbed the steer), so this is the one channel here that really acknowledges consumption. An idle call returns `startedNewTurn` - a detached turn - so the Runner refuses to steer an idle session."
host_skill_entry: "$kaola-project-runner"
quota_packages: "[{\"id\":\"primary\",\"name\":\"Primary\"},{\"id\":\"base_model_inference\",\"name\":\"Base model inference\"}]"
model_package_rule: "{\"kind\":\"native_field\",\"field\":\"limitIds\",\"values\":{\"primary\":\"primary\",\"base_model_inference\":\"base_model_inference\"},\"absent\":\"primary\"}"
