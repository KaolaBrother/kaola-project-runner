id: "claude-code"
runtime_name: "Claude Code"
skill_name: "claude-code-kaola-project-runner"
display_name: "Claude Code Kaola Project Runner"
short_description: "Communicate with Claude Code through exact tmux"
default_prompt: "Use $claude-code-kaola-project-runner to start an exact Claude Code tmux session, read its output, and send only the input I choose."
description: "Use when Codex should communicate with a Claude Code main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "claude-code-kaola"
binary_name: "claude"
binary_env: "CLAUDE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the Claude executable and report optional Kaola carrier and launch-option evidence without gating communication."
launch_summary: "Launch Claude from the canonical repository root with --permission-mode bypassPermissions (default). ACP start sets mode=bypassPermissions after a working initialize; the pinned wrapper remains probe-eof."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified Claude-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Opus 5 High"
default_model_id: "opus"
default_model_parameters: "effort=high"
default_transport: "pty"
acp_command: "npx --yes @agentclientprotocol/claude-agent-acp@0.18.0"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "pinned wrapper fetched but exited before initialize (probe-eof); PTY login requirement remains"
acp_verified_versions: "wrapper=0.18.0;initialize=probe-eof"
acp_env_allowlist: "ANTHROPIC_API_KEY"
acp_login_requires_pty: "true"
acp_model_config_id: ""
acp_effort_config_id: ""
acp_wrapper_pin: "0.18.0"
