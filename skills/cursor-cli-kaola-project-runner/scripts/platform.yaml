id: "cursor-cli"
runtime_name: "Cursor CLI"
skill_name: "cursor-cli-kaola-project-runner"
display_name: "Cursor CLI Kaola Project Runner"
short_description: "Communicate with Cursor CLI through exact ACP"
default_prompt: "Use $cursor-cli-kaola-project-runner to start an exact Cursor CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Cursor Agent CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "cursor-cli-kaola"
binary_name: "cursor-agent"
binary_env: "CURSOR_AGENT_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <chat-id>"
preflight_summary: "Verify the Cursor executable and report optional global/project Workflow command evidence without gating communication."
launch_summary: "Launch cursor-agent --workspace <repo> --yolo without materializing or modifying project files. ACP process is cursor-agent --yolo acp; configOptions.mode has no skip-all value."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "Grok 4.7 Extra High"
default_model_id: "grok-4.7-xhigh"
default_model_parameters: "effort=xhigh (encoded in model ID), fast=false"
default_model_effort: "xhigh"
upgrade_model_name: "Claude Opus 5.5 High"
upgrade_model_id: "claude-opus-5-5-high"
upgrade_model_parameters: "effort=high (encoded in model ID)"
upgrade_model_effort: "high"
alt_tier_label: ""
alt_model_name: ""
alt_model_id: ""
alt_model_parameters: ""
alt_model_effort: ""
fast_support: "model-variant+acp-config"
fast_summary: "Fast via the ACP parameterized `fast` option (true/false strings), which applies to any model; a `-fast` catalog id (e.g. grok-4.7-xhigh-fast) decomposes onto that option; an unsupported variant is reported rather than invented"
acp_command: "cursor-agent --yolo acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "agentInfo is empty; initialize with _meta.parameterizedModelPicker=true so ACP advertises separate model/effort/fast options with base model IDs and string true/false fast values; the model-scoped option SET follows the selected model (the default preset advertises reasoning_effort, the upgrade preset effort), so the effort id is resolved from the options advertised after the model apply; the CLI persists the selected model and parameters in ~/.cursor/cli-config.json and a plain launch advertises that persisted schema"
acp_verified_versions: "cli=2026.09.18-9a7762b;protocol=1"
acp_env_allowlist: "CURSOR_API_KEY"
acp_login_requires_pty: "false"
acp_init_meta: "parameterizedModelPicker=true"
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort;effort"
acp_fast_config_id: "fast"
acp_fast_values: "off=false,on=true"
acp_model_map: "grok-4.7-xhigh=grok-4.7;grok-4.7-xhigh-fast=grok-4.7;claude-opus-5-5-high=claude-opus-5-5"
acp_wrapper_pin: ""
native_steering: "unsupported"
acp_steer_method: ""
steering_summary: "No steering entry on the ACP surface: `_session/steering`, `session/steering`, `session/steer`, and `_session/steer` all answer JSON-RPC -32601 on cli 2026.09.10-fd3934a, and `initialize` advertises no steering `_meta`. A second `session/prompt` during a live turn CANCELS the original turn (`stopReason: cancelled`) instead of steering it, so it is not a substitute."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"cursor-models\",\"name\":\"Cursor models\"},{\"id\":\"other-models\",\"name\":\"Other models\"}]"
model_package_rule: "{\"kind\":\"explicit\",\"map\":{\"auto\":\"cursor-models\",\"default\":\"cursor-models\",\"grok-4.7-xhigh\":\"other-models\",\"grok-4.7\":\"other-models\",\"grok-4.7-xhigh-fast\":\"other-models\",\"claude-opus-5-5-high\":\"other-models\",\"claude-opus-5-5\":\"other-models\"}}"
