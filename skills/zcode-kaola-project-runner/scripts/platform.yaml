id: "zcode"
runtime_name: "ZCode"
skill_name: "zcode-kaola-project-runner"
display_name: "ZCode Kaola Project Runner"
short_description: "Communicate with ZCode through exact tmux"
default_prompt: "Use $zcode-kaola-project-runner to start an exact ZCode tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a ZCode main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "zcode-kaola"
binary_name: "zcode"
binary_env: "ZCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the explicit ZCode runtime path and report app-server readiness and Coding Plan provider facts without PATH discovery; the bundled runtime ships no terminal UI."
launch_summary: "Launch the installed ZCode CLI from explicit KAOLA_ZCODE_ENTRY and KAOLA_ZCODE_NODE (or ZCODE_BIN) with --mode yolo (CLI 0.16.5 permission mode that bypasses per-tool prompts; --permission-mode is the legacy alias). ACP (the default) runs Skill-relative kaola-zcode-acp.py over app-server --stdio; ACP start sets mode=yolo after initialize. Explicit --transport pty is a known-unsupported diagnostic entry, not a login or fallback channel: the bundled runtime cannot open a terminal UI (Cannot find package @zcode/tui) and headless --prompt needs ~/.zcode/cli/config.json. The adapter reads the desktop provider registry (~/.zcode/v2/config.json) read-only and selects the enabled GLM Coding Plan provider (Start Plan and pay-as-you-go refused). Because the shipped 3.12.x entry cannot locate its own bundled provider table, the adapter resolves that table next to the verified entry and injects both ZCODE_BUILTIN_PROVIDER_CONFIG_FILE and ZCODE_PERSONAL_PROVIDER_CONFIG_FILE (both or neither, never inherited). On 3.12+ it registers the plan through provider/updateAccountConfig, creates the session with no model channel, selects the model on the account:* provider through session/setModel with persistAsWorkspaceLastUsed false, and answers interaction/requestProviderRuntimeHeaders per model request; a pre-3.12 app-server keeps the in-memory runtimeModel overlay, chosen by that backend's own error rather than a version gate. It never writes ~/.zcode/cli/config.json, never injects auth env, and never logs the plan credential. Login happens in the ZCode desktop App, never through the Runner."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
