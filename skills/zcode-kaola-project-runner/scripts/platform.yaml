acp_quirks: "Runner-owned ACP translator over the installed ZCode app-server --stdio (Gate 2); william0wang/zcode-acp is a protocol reference only (Apache-2.0 pin 80aa4e2), never vendored and never npm; explicit KAOLA_ZCODE_ENTRY and KAOLA_ZCODE_NODE, never PATH; child env allowlist with no auth injection; the enabled Coding Plan provider is registered in memory per backend process -- on ZCode 3.12+ via provider/updateAccountConfig plus session/setModel on the account:* provider with the credential supplied only through interaction/requestProviderRuntimeHeaders, and on pre-3.12 app-servers via the runtimeModel overlay on session/create, session/resume and session/setModel (launch facts in platform.md); agentInfo._meta.zcode reports providerId, baseURL, plan-cache status and model ids; the Runner default and upgrade presets both pin GLM-5.3 at thought=max, the same pair the Issue #108 Host gate enforces (ZCODE_HOST_MODEL_ID/ZCODE_HOST_EFFORT in kaola-acp.py; their equality with this manifest is asserted by a test, so there is no second source of truth); the bare id is what this manifest declares because the live ACP option value is provider-qualified with a backslash (builtin:bigmodel-coding-plan\\GLM-5.3 on the builtin plan, account:*\\GLM-5.3 once the plan is registered) and comparison uses the tail after \\ or /, so GLM-5.3-Flash never matches; the live effort config id is thoughtLevel while this manifest declares thought, which both the Runner read path and the adapter write path accept alongside thought_level; neither model nor thoughtLevel advertises a currentValue at session/new, so a selection is verified only after it is applied; login happens in the ZCode desktop App; PTY is unsupported by the bundled runtime (no terminal UI) and is a diagnostic entry only"
