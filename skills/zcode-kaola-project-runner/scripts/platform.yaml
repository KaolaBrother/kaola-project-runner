native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "ZCode 3.12+ (app-server 0.16+) moved mid-turn steering to the v4 command surface, live-proven on installed 3.12.3 (Issue #81): `v4/command sendText{requestedDelivery:\"guide\"}` is admitted as a guide input and injected at the next tool/message boundary inside the running turn. The adapter sends it with an `expectedTurnId` per-turn CAS learned from `turn.started`, and decides the outcome from the events alone — the sendText ack is a measured trap (`result.delivery` reads \"queue\" even for admitted guide input) — so `injected` requires `turn.steerQueued{delivery:\"guide\"}` plus `turn.steerDrained{injectedMessageIds}` naming the same `targetTurnId`, and that turn must be the one the steer targeted. Queue-only admission maps to `not_consumed`, a turn-end race or silence to `unknown`, a platform rejection surfaces its `reasonCode`, and `-32601` on pre-0.16 backends yields `unsupported`. The events ride the existing session/event stream; the adapter primes `v4/conversation/subscribe` lazily inside the steer path. `--steer-mode interrupt` remains the explicit fallback (0.16.5 accepts session/cancel at once but the turn was measured settling `cancelled` only after ~70-100 s, finishing shell steps meanwhile, so a short `--cancel-timeout` buys a truthful `unknown`, not a faster steer)."
