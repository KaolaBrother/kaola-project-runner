id: "zcode"
runtime_name: "ZCode"
skill_name: "zcode-kaola-project-runner"
display_name: "ZCode Kaola Project Runner"
short_description: "Communicate with ZCode through exact tmux"
default_prompt: "Use $zcode-kaola-project-runner to start an exact ZCode tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a ZCode main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "zcode-kaola"
binary_name: "zcode"
binary_env: "ZCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--resume <session-id>"
preflight_summary: "Verify the explicit ZCode runtime path and report app-server readiness and Coding Plan provider facts without PATH discovery; the bundled runtime ships no terminal UI."
launch_summary: "Launch the installed ZCode CLI from explicit KAOLA_ZCODE_ENTRY and KAOLA_ZCODE_NODE (or ZCODE_BIN) with --mode yolo (CLI 0.16.5 permission mode that bypasses per-tool prompts; --permission-mode is the legacy alias). ACP (the default) runs Skill-relative kaola-zcode-acp.py over app-server --stdio; ACP start sets mode=yolo after initialize. Explicit --transport pty is a known-unsupported diagnostic entry, not a login or fallback channel: the bundled runtime cannot open a terminal UI (Cannot find package @zcode/tui) and headless --prompt needs ~/.zcode/cli/config.json. The adapter reads the desktop provider registry (~/.zcode/v2/config.json) read-only, selects the enabled GLM Coding Plan provider (Start Plan and pay-as-you-go refused), and hands it to the app-server in memory as the protocol's runtimeModel overlay; it never writes ~/.zcode/cli/config.json, never injects auth env, and never logs the plan credential. Login happens in the ZCode desktop App, never through the Runner."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "enabled Coding Plan, first listed model"
default_model_id: ""
default_model_parameters: ""
default_model_effort: ""
upgrade_model_name: "enabled Coding Plan, first listed model"
upgrade_model_id: ""
upgrade_model_parameters: ""
upgrade_model_effort: ""
fast_support: "none"
fast_summary: "no native Fast toggle; thought level is a separate config option (low/high/max)"
default_transport: "acp"
acp_command: "python3 $SKILL_DIR/scripts/kaola-zcode-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "Runner-owned ACP translator over installed ZCode app-server --stdio (Gate 2); william0wang/zcode-acp is a protocol reference only (Apache-2.0 pin 80aa4e2), never vendored and never npm; explicit KAOLA_ZCODE_ENTRY and KAOLA_ZCODE_NODE, never PATH; child env allowlist (no auth env injection); CLI 0.16.5 needs a model provider that headless app-server cannot read from the desktop login, so the adapter passes the enabled GLM Coding Plan provider from ~/.zcode/v2/config.json in memory via runtimeModel on session/create, session/resume and session/setModel (desktop-App parity, apiKey source inline, never logged, never written to disk); Start Plan (headless captcha) and pay-as-you-go providers are refused; agentInfo._meta.zcode reports providerId, baseURL, plan-cache status and model ids; login happens in the ZCode desktop App; PTY is unsupported by the bundled runtime (no terminal UI) and is selectable only as a diagnostic entry"
acp_verified_versions: "cli=0.16.5;adapter=kaola-zcode-acp;protocol=1"
acp_env_allowlist: ""
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "thought"
acp_fast_config_id: ""
acp_fast_values: ""
