acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: "deepseek/deepseek-flash=deepseek:deepseek-flash"
acp_wrapper_pin: ""
native_steering: "unknown"
acp_steer_method: ""
steering_summary: "MacBook 2026-10-28: a busy second send is holder-refused prompt-in-progress and never reaches Hermes. A bare after-turn steer is refused steer-mode-required and writes nothing. Native busy processing, the after-turn holder queue, and worker-result notification were not measured. native_steering stays unknown. Mini and Studio not measured."
