id: "hermes"
runtime_name: "Hermes Agent"
skill_name: "hermes-kaola-project-runner"
display_name: "Hermes Agent Kaola Project Runner"
short_description: "Communicate with a Hermes Agent through exact ACP"
default_prompt: "Use $hermes-kaola-project-runner to start an exact Hermes Agent ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Hermes Agent main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "hermes-kaola"
binary_name: "hermes"
binary_env: "HERMES_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/load <session-id> over ACP"
preflight_summary: "Verify the hermes executable, report `hermes --version` and, without gating, the result of `hermes acp --check`; never run `--setup` or `--setup-browser`, never read `~/.hermes/.env`, and never write anything under $HERMES_HOME (default ~/.hermes)."
launch_summary: "The local ACP adapter runs the exact HERMES_BIN as one `hermes --yolo acp` stdio child per ACP holder (`--accept-hooks` is never passed and the caller's HERMES_YOLO_MODE/HERMES_ACCEPT_HOOKS are stripped from its environment). The adapter synthesizes the `model` and `mode` select configOptions from the session/new, load and fork `models`/`modes` blocks, turns `session/set_config_option` for them into `session/set_model`/`session/set_mode`, surfaces the real Hermes error, and refuses any other configId locally. On 0.22.6 the runtime also sends its own native configOptions on that reply; the adapter replaces them with the synthesized list, while a native `config_option_update` notification is forwarded unchanged (see `acp_quirks`). Resume is `session/load`: the adapter removes `resume` from `sessionCapabilities` and turns any `session/resume` it still receives into `session/load`, refusing a null or mismatched result so a silent fresh session is never reported as resumed. Effort comes from Hermes config; 0.22.6 adds a native `reasoning_effort` config option that the adapter does not surface. An ACP child exit is not proof the gateway-owned session ended. MacBook 2026-10-28 exact stop left residual_pids empty and the record stopped, and a later session/load of the same id still attached. Mini and Studio run 0.22.6 but were not driven through a live ACP session."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "unmeasured (source-read only; #417 measures live)"
default_model_name: "DeepSeek V4.1 Flash 1017"
default_model_id: "deepseek/deepseek-flash"
default_model_parameters: "effort=high (native reasoning_effort exists on 0.22.6; the adapter does not surface it)"
default_model_effort: "high"
default_model_profile: "Fast, low-cost worker for self-contained tasks with clear goals, boundaries, acceptance criteria; strong at 3D and frontend; one-pass complete features; iterative validation, self-repair. Review each output; split long chain."
default_model_class: "Worker"
named_tiers: "max"
max_model_name: "DeepSeek V4.1 Flash 1017"
max_model_id: "deepseek/deepseek-flash"
max_model_parameters: "effort=max (native reasoning_effort exists on 0.22.6; the adapter does not surface it)"
max_model_effort: "max"
max_model_profile: "Escalation level: use it when the Hermes Agent default (DeepSeek V4.1 Flash 1017 high) cannot solve the task."
max_model_class: "Worker"
fast_support: "none"
fast_summary: "no native Fast toggle and no Fast config option on the ACP surface (MacBook 0.22.6; 0.22.6 has a native reasoning_effort option but the adapter does not surface it)"
acp_command: "python3 $SKILL_DIR/scripts/kaola-hermes-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "MacBook 2026-10-28 (Hermes Agent v0.22.5) and 2026-11-03 (v0.22.6), agent hermes-agent/0.22.5 → 0.22.6, protocol 1; Mini and Studio are on 0.22.6 but were not driven through a live ACP session. session/new currentModelId is the gateway auto default (an Anthropic Opus id; the exact wire id is in the 2026-10-28 evidence doc) and currentModeId is default; available modes are default, accept_edits, and dont_ask. session/set_model and session/set_mode return {}. The adapter echoes the requested configOptions currentValue, so status session_meta.models and session_meta.modes stay the session/new snapshot while configOptions show the requested values. A live re-read is session/load: currentModelId deepseek:deepseek-flash (Provider: DeepSeek) and currentModeId dont_ask. That load result omitted sessionId; the adapter accepts a missing id and refuses only a present mismatch (-32002, not hit live). initialize advertises sessionCapabilities.resume and the adapter strips it. An unknown session/load is Hermes -32603 not_found, not a fresh session and not adapter -32002. An unservable model is Hermes -32603 model_resolution_failed, not local -32602; local -32602 remains the unknown-configId path and was not sent live. A busy second send is holder-refused prompt-in-progress and does not reach Hermes. dont_ask auto-approved a normal edit; id_ed25519 still requested permission (allow_once, deny). The child argv is hermes --yolo acp; HERMES_YOLO_MODE and HERMES_ACCEPT_HOOKS were absent from the child env; --accept-hooks was never passed; no unseen-hook prompt was observed. 0.22.6 adds native session/new, load and fork configOptions (edit_approval_policy ask/workspace_session/session, model, reasoning_effort current medium with none/minimal/low/medium/high/xhigh/max/ultra) and a config_option_update notification; the adapter replaces the reply list with model and mode but forwards the update unchanged, so a holder session_meta.configOptions mirror can carry the native ids after a typed /model or /reasoning (model stays readable, mode becomes edit_approval_policy; the pin condition native-config-update-unmapped names it). 0.22.6 set_config_option applies model and reasoning_effort and returns the full list (0.22.5 returned []); an unknown id is still accepted silently, so the adapter's local -32602 refusal stays. session/set_model and session/set_mode still return {}. session/load still omits sessionId and reads back deepseek:deepseek-flash / dont_ask. session/cancel still returns cancelled; from 0.22.6 it ends only the turn and leaves background delegations running. reasoning_effort is a real 0.22.6 ACP option but the adapter does not surface it, so effort stays a Hermes-config fact. ACP has no base URL; the provider read-back is id deepseek plus auth method deepseek runtime credentials. A cold HERMES_HOME returned acp-initialize-timeout, not login-required. Exact stop left residual_pids empty, and a later session/load of the same id still attached. At compressionDepth 0 the provenance acp, current, and root ids match. Quit text and continue_syntax were not measured. native_steering stays unknown."
acp_verified_versions: "cli=0.22.6;agent=hermes-agent/0.22.6;protocol=1;condition=macbook-20261103-native-config-update-unmapped"
acp_env_allowlist: "HERMES_HOME"
acp_login_requires_pty: "true"
login_summary: "Provider setup is a human act outside the Runner (`hermes acp --setup` or `hermes model`, interactive); the Runner never runs it. With no resolved provider credential, session/new fails and the adapter reports `login required`, which the holder reports as the recoverable `login-required` refusal."
permission_summary: "The adapter launches `hermes --yolo acp` (never `--accept-hooks`; the caller's `HERMES_YOLO_MODE`/`HERMES_ACCEPT_HOOKS` are not passed through). `start` sets mode `dont_ask`. MacBook 0.22.5 (the live permission measurement) auto-approved a normal edit and still asked for `id_ed25519`, settled by `permit` `allow_once`; the 0.22.6 edit-approval diff changes only the displayed title."
