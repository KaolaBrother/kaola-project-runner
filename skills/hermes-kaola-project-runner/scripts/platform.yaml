id: "hermes"
runtime_name: "Hermes Agent"
skill_name: "hermes-kaola-project-runner"
display_name: "Hermes Agent Kaola Project Runner"
short_description: "Communicate with a Hermes Agent through exact ACP"
default_prompt: "Use $hermes-kaola-project-runner to start an exact Hermes Agent ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Hermes Agent main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "hermes-kaola"
binary_name: "hermes"
binary_env: "HERMES_BIN"
continue_syntax: "unsupported"
resume_syntax: "session/load <session-id> over ACP"
preflight_summary: "Verify the hermes executable, report `hermes --version` and, without gating, the result of `hermes acp --check`; never run `--setup` or `--setup-browser`, never read `~/.hermes/.env`, and never write anything under $HERMES_HOME (default ~/.hermes)."
launch_summary: "The local ACP adapter runs the exact HERMES_BIN as one `hermes --yolo acp` stdio child per ACP holder (`--accept-hooks` is never passed and the caller's HERMES_YOLO_MODE/HERMES_ACCEPT_HOOKS are stripped from its environment). The adapter synthesizes the `model` and `mode` select configOptions from the session/new, load and fork `models`/`modes` blocks, turns `session/set_config_option` for them into `session/set_model`/`session/set_mode`, surfaces the real Hermes error, and refuses any other configId locally. Resume is `session/load`: the adapter removes `resume` from `sessionCapabilities` and turns any `session/resume` it still receives into `session/load`, refusing a null or mismatched result so a silent fresh session is never reported as resumed. Effort comes from Hermes config, not an ACP option. An ACP child exit is not proof the gateway-owned session ended; the measured stop proof is #417."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "unmeasured (source-read only; #417 measures live)"
default_model_name: "DeepSeek V4.1 Flash 1017"
default_model_id: "deepseek/deepseek-flash"
default_model_parameters: "effort=high (no ACP effort option)"
default_model_effort: "high"
default_model_profile: "Fast, low-cost worker for self-contained tasks with clear goals, boundaries, acceptance criteria; strong at 3D and frontend; one-pass complete features; iterative validation, self-repair. Review each output; split long chain."
default_model_class: "Worker"
named_tiers: "max"
max_model_name: "DeepSeek V4.1 Flash 1017"
max_model_id: "deepseek/deepseek-flash"
max_model_parameters: "effort=max (no ACP effort option)"
max_model_effort: "max"
max_model_profile: "Escalation level: use it when the Hermes Agent default (DeepSeek V4.1 Flash 1017 high) cannot solve the task."
max_model_class: "Worker"
fast_support: "none"
fast_summary: "no native Fast toggle and no Fast config option on the ACP surface (source-read only; #417 measures live)"
acp_command: "python3 $SKILL_DIR/scripts/kaola-hermes-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "unmeasured (source-read only; #417 measures live): in-repo adapter over `hermes --yolo acp`; the session/new, load and fork results carry `models` and `modes` blocks but no `configOptions`, so the adapter synthesizes `model` and `mode` select options from them and refreshes the cached mode currentValue on `current_mode_update`; `session/set_config_option` for `model`/`mode` is translated to `session/set_model`/`session/set_mode`, any other configId is refused locally -32602 because Hermes accepts an unknown id silently; `session/resume` is never trusted (an unknown id may silently create a fresh session), so the adapter advertises no resume capability and forwards a received resume as `session/load`, refusing a null result or a mismatched sessionId (-32002); a second `session/prompt` while a turn is busy is a pure pass-through; source-read `acp_adapter/modes.py` modes are ask/accept_edits/dont_ask"
acp_verified_versions: "unmeasured (source-read only; #417 measures live)"
acp_env_allowlist: "HERMES_HOME"
acp_login_requires_pty: "true"
login_summary: "Provider setup is a human act outside the Runner (`hermes acp --setup` or `hermes model`, interactive); the Runner never runs it. With no resolved provider credential, session/new fails and the adapter reports `login required`, which the holder reports as the recoverable `login-required` refusal."
permission_summary: "The adapter launches `hermes --yolo acp` (never `--accept-hooks`; the caller's `HERMES_YOLO_MODE`/`HERMES_ACCEPT_HOOKS` are not passed through). `start` sets mode `dont_ask` (edit approvals; sensitive paths still ask), the most permissive source-read `acp_adapter/modes.py` value; any remaining `session/request_permission` is settled by `permit`. #417 confirms live."
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: ""
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: "deepseek/deepseek-flash=deepseek:deepseek-flash"
acp_wrapper_pin: ""
native_steering: "unknown"
acp_steer_method: ""
steering_summary: "unmeasured (source-read only; #417 measures live): a second `session/prompt` while a turn is busy is queued or redirected per the source read and returns `end_turn` at once; the adapter is a pure pass-through and claims no steer method."
host_skill_entry: ""
quota_packages: "[{\"id\":\"deepseek\",\"name\":\"DeepSeek\",\"windows\":null}]"
model_package_rule: "{\"kind\":\"provider_prefix\",\"providers\":{\"deepseek\":\"deepseek\"}}"
