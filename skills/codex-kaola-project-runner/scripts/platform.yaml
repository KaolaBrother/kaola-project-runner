id: "codex"
runtime_name: "Codex CLI"
skill_name: "codex-kaola-project-runner"
display_name: "Codex CLI Kaola Project Runner"
short_description: "Communicate with Codex CLI through exact ACP"
default_prompt: "Use $codex-kaola-project-runner to start an exact Codex CLI ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with a Codex CLI main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "codex-kaola"
binary_name: "codex"
binary_env: "CODEX_BIN"
continue_syntax: "resume --last"
resume_syntax: "resume <session-id>"
preflight_summary: "Verify the Codex executable and report optional Kaola Workflow skill or plugin carrier evidence without making Workflow availability a communication gate."
launch_summary: "ACP runs the pinned npx codex-acp wrapper (@openai/codex plus @agentclientprotocol/codex-acp); ACP start sets mode=agent-full-access after initialize."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/quit"
default_model_name: "GPT-6.1 Sol"
default_model_id: "gpt-6.1-sol"
default_model_parameters: "effort=high"
default_model_effort: "high"
default_model_profile: "Good at exploring directions, finding problems, review, and computer use, but prone to over-engineering; set a clear scope and hold it to the minimal necessary solution."
default_model_class: "Elite"
named_tiers: "astra,luna"
astra_model_name: "GPT-6 Astra"
astra_model_id: "gpt-6-astra"
astra_model_parameters: "effort=high"
astra_model_effort: "high"
astra_model_profile: "Design, goal definition and decomposition, issue creation, and review; only with explicit user permission for each task; no concrete implementation or execution, not a regular worker."
astra_model_class: "Expert"
luna_model_name: "GPT-6 Luna"
luna_model_id: "gpt-6-luna"
luna_model_parameters: "effort=max"
luna_model_effort: "max"
luna_model_profile: "Fast, flexible implementation worker with good reasoning for its class and computer-use capability; relatively exploratory and suited to tasks whose implementation path is not fully predetermined."
luna_model_class: "Worker"
fast_support: "config"
fast_summary: "Codex fast mode via ACP `fast-mode` configId (off/on); explicit off is applied, not assumed"
acp_command: "npx --yes --package @openai/codex@0.158.0 --package @agentclientprotocol/codex-acp@2.0.0 codex-acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "adapter translates ACP stdio to Codex App Server; CODEX_PATH selects the Codex binary, otherwise its bundled @openai/codex pin (0.158.0/2.0.0 live-verified 2026-09-29 on an isolated gpt-6-luna/max seat, Issue #226); session capabilities advertise empty objects; native ACP mode read-only is upstream 'Read-only' (readOnly sandbox, on-request; a write needs an explicit client approval), workspace-write is 'Workspace access', agent is 'Auto review' (auto_review), and agent-full-access is 'Full access'. The Runner mode config option is the turn sandbox; session/new modes.currentModeId stays the adapter default agent until session/set_mode"
acp_verified_versions: "cli=0.158.0;adapter=2.0.0;protocol=1"
acp_env_allowlist: "CODEX_API_KEY,OPENAI_API_KEY,CODEX_PATH"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "`start` sets ACP `mode=agent-full-access`; `--permission-mode MODE` sets another advertised `mode` value (`read-only` is the upstream read-only sandbox; a write needs client approval)"
acp_init_meta: ""
acp_session_new_timeout: "60"
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "reasoning_effort"
acp_fast_config_id: "fast-mode"
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: "2.0.0"
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "Native ACP steering extension: adapters 1.11.0 and 1.13.0 advertise `_meta.steering.supported=true` at `initialize` and serve `_session/steering`, returning `injected` while a turn runs (live on 1.11.0: the original `session/prompt` still settled `end_turn` and absorbed the steer). An idle call returns `startedNewTurn` - a detached turn - so the Runner refuses to steer an idle session."
host_skill_entry: "$kaola-project-runner"
quota_packages: "[{\"id\":\"primary\",\"name\":\"Primary\",\"windows\":[\"weekly\"]},{\"id\":\"base_model_inference\",\"name\":\"Base model inference\",\"windows\":[\"weekly\"]}]"
model_package_rule: "{\"kind\":\"native_field\",\"field\":\"limitIds\",\"values\":{\"primary\":\"primary\",\"base_model_inference\":\"base_model_inference\"},\"absent\":\"primary\"}"
