id: "opencode"
runtime_name: "OpenCode"
skill_name: "opencode-kaola-project-runner"
display_name: "OpenCode Kaola Project Runner"
short_description: "Communicate with OpenCode through exact ACP"
default_prompt: "Use $opencode-kaola-project-runner to start an exact OpenCode ACP session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an OpenCode main conversation through an exact owned ACP session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "opencode-kaola"
binary_name: "opencode"
binary_env: "OPENCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the OpenCode executable and report optional Kaola carrier/configuration evidence without gating communication; loopback preflight describes the caller environment, while ACP launches strip inherited forward proxies by default."
launch_summary: "ACP runs opencode acp. Ordinary fresh managed launches select a process-only native V2 build allow policy through OPENCODE_CONFIG when no config source or explicit mode is supplied; existing native config, explicit mode, resume/continue and custom command retain precedence. start reports native_permission_policy. ACP has no skip-all config option; permit settles each request that still arises."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "DeepSeek V4.1 Flash"
default_model_id: "opencode-go/deepseek-v4.1-flash"
default_model_parameters: "effort=max via ACP option effort"
default_model_effort: "max"
default_model_profile: "Fast implementation worker for tasks with clear goals and boundaries; tends to investigate deeper root causes and reduce unrelated changes."
default_model_class: "Worker"
named_tiers: ""
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as zhipuai-coding-plan/glm-5.3-flash are explicit model choices, not a Fast switch"
acp_command: "python3 $SKILL_DIR/scripts/kaola-opencode-acp.py"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "Native ACP is bundled with @opencode/cli, with no independent wrapper pin; KPR adds its local steer adapter. On 2.2.5/protocol 1 there is no ACP skip-all config option; model/effort/mode are ACP selections, not launch-level permission policy; requests offer allow_once/allow_always/reject_once. Fresh managed launches select agents.build.permissions allow through the native OPENCODE_CONFIG file only when no existing config source or explicit mode/resume/custom command exists; supplied configuration retains precedence and permit settles each request that still arises. V1 permission/bash/task differs from V2 permissions/shell/subagent. ACP launches strip the six HTTP/HTTPS/ALL forward proxy variables by default; OpenCode does not opt in, so existing NO_PROXY/no_proxy values remain unchanged and no loopback entries are appended on that path. V2 uses loopback HTTP; upstream 2.2.4 also reports a native local-service proxy bypass. Model discovery can update after session/new: start waits, bounded, for the target in config_option_update before selection, without substituting a different model. A controlled delayed-catalog run verified this with 2.0.32 and 2.2.5; the latter session export confirms actual opencode-go/deepseek-v4.1-flash with max effort."
acp_verified_versions: "cli=2.2.5;adapter=native-cli-2.2.5;protocol=1"
acp_env_allowlist: "OPENCODE_API_KEY,NO_PROXY"
acp_login_requires_pty: "false"
login_summary: "Login is a human act outside the Runner and needs no terminal."
permission_summary: "Native V2 build full-access default only for fresh managed launches without existing config sources; existing global/project/native config is left intact (including non-permission config). Explicit --permission-mode selects the native build/plan agent via mode and suppresses the default. No auto-permit; remaining requests require an Agent decision."
acp_init_meta: ""
acp_mode_config_id: "mode"
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "supported"
acp_steer_method: "_session/steering"
steering_summary: "OpenCode 2.2.5 uses the local V2 integration. The local adapter exposes _session/steering, guards the original active ACP request id and calls the native plugin session.prompt API with delivery steer and resume false. Native ACP retains its stream and original prompt. written with native-admitted confirms inbox admission only; actual consumption needs output evidence. A turn-end race can leave input pending; it cannot resume an idle turn. No cancel fallback. Old holders and custom opencode acp commands have no adapter entry; a controlled restart is needed to use this path."
host_skill_entry: "/kaola-project-runner"
quota_packages: "[{\"id\":\"opencode-go\",\"name\":\"OpenCode Go\",\"windows\":[\"weekly\",\"monthly\"]},{\"id\":\"zhipuai-coding-plan\",\"name\":\"ZhipuAI Coding Plan\",\"windows\":[\"5h\"]},{\"id\":\"zen\",\"name\":\"Zen\",\"windows\":null}]"
model_package_rule: "{\"kind\":\"provider_prefix\",\"providers\":{\"opencode-go\":\"opencode-go\",\"zhipuai-coding-plan\":\"zhipuai-coding-plan\"},\"gaps\":[\"zen\"]}"
