id: "opencode"
runtime_name: "OpenCode"
skill_name: "opencode-kaola-project-runner"
display_name: "OpenCode Kaola Project Runner"
short_description: "Communicate with OpenCode through exact tmux"
default_prompt: "Use $opencode-kaola-project-runner to start an exact OpenCode tmux session, read its output, and send only the input I choose."
description: "Use when the controlling Agent should communicate with an OpenCode main conversation through an exact tmux session by starting it, reading evidence, sending Agent-selected prompts or keys, reading replies, and stopping only that session."
session_prefix: "opencode-kaola"
binary_name: "opencode"
binary_env: "OPENCODE_BIN"
continue_syntax: "--continue"
resume_syntax: "--session <session-id>"
preflight_summary: "Verify the OpenCode executable and report optional Kaola carrier/configuration evidence without gating communication."
launch_summary: "Launch opencode <repo> --auto. V2 removed the --mini flag, its mini subcommand takes neither a directory nor --auto, and top-level --model/--variant are rejected outright. Default ACP has no skip-all; PTY --auto via --transport pty is the bypass; configOptions.mode is agent identity (build/plan), not skip-all."
recurring_execution: "unsupported"
recurring_summary: "Use the caller-selected one-shot, Codex heartbeat, or live-verified runtime-native carrier described in [scheduling.md](scheduling.md)."
quit_text: "/exit"
default_model_name: "CLI native opening model"
default_model_id: ""
default_model_parameters: "no Runner model or effort override"
default_model_effort: ""
upgrade_model_name: "CLI native opening model"
upgrade_model_id: ""
upgrade_model_parameters: "no Runner model or effort override"
upgrade_model_effort: ""
alt_tier_label: ""
alt_model_name: ""
alt_model_id: ""
alt_model_parameters: ""
alt_model_effort: ""
fast_support: "none"
fast_summary: "no native Fast toggle; speed-named catalog models such as zhipuai-coding-plan/glm-5.3-flash are explicit model choices, not a Fast switch"
default_transport: "acp"
acp_command: "opencode acp"
acp_client_capabilities: "terminal:false,fs:false"
acp_quirks: "no ACP skip-all measured on 2.0.11 - session/request_permission offers only allow_once/allow_always/reject_once and configOptions carries model/effort/mode only; PTY --auto via --transport pty is the bypass. V2 reaches its own server over loopback HTTP, so a forward proxy with no loopback NO_PROXY entry leaves initialize working while every session method answers ClientError"
acp_verified_versions: "cli=2.0.11;protocol=1"
acp_env_allowlist: "OPENCODE_API_KEY,NO_PROXY"
acp_login_requires_pty: "false"
acp_init_meta: ""
acp_mode_config_id: ""
acp_model_config_id: "model"
acp_effort_config_id: "effort"
acp_fast_config_id: ""
acp_fast_values: ""
acp_model_map: ""
acp_wrapper_pin: ""
native_steering: "unknown"
acp_steer_method: ""
steering_summary: "Historical evidence, OpenCode 1.18.17: no steering entry on the ACP surface - all four candidate methods answered JSON-RPC -32601 and `initialize` advertised no steering `_meta`. That probe is a 1.18.17 result, not a measurement of the `acp_verified_versions` 2.0.11 build; V2 rewrote the CLI around a background service, and while 2.0.11 `initialize` was observed to advertise no steering `_meta` either, no steering method was re-probed there, so treat its native-steering capability as unknown until a live probe settles it, and do not read the 1.18.17 outcome as a current-version claim. The composite `--steer-mode interrupt` is unaffected and was exercised live on 1.18.31."
